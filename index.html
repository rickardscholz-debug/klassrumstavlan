<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klassrumstavlan</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#172033;
}

body{
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transition:background-image .3s ease;
}

/* =========================
   TOOLBAR
========================= */

#toolbar{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:10000;

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 14px;

  background:rgba(255,255,255,.96);
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;

  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.tool{
  width:62px;
  height:62px;
  border:0;
  background:transparent;
  border-radius:16px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;

  color:#172033;
  font-size:11px;
}

.tool:hover{
  background:#f0f3f8;
}

.toolIcon{
  font-size:27px;
  line-height:27px;
}

.toolText{
  white-space:nowrap;
}

/* =========================
   GEMENSAMT FÖNSTER
========================= */

.window{
  position:absolute;

  min-width:280px;
  min-height:180px;

  width:420px;
  height:300px;

  background:rgba(255,255,255,.98);

  border:1px solid rgba(20,30,50,.12);
  border-radius:18px;

  box-shadow:0 12px 35px rgba(0,0,0,.20);

  overflow:hidden;

  resize:both;

  z-index:100;
}

.window.hidden{
  display:none;
}

.window.minimized{
  width:230px !important;
  height:58px !important;
  min-width:230px;
  min-height:58px;
  resize:none;
}

.window.minimized .windowBody{
  display:none;
}

.windowHeader{
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px 0 17px;

  background:#ffffff;

  border-bottom:1px solid #e7eaf0;

  cursor:move;

  user-select:none;
}

.windowTitle{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:17px;
  font-weight:700;
}

.windowTitleIcon{
  font-size:23px;
}

.windowButtons{
  display:flex;
  gap:5px;
}

.windowButton{
  width:34px;
  height:34px;

  border:0;
  border-radius:10px;

  background:#f3f5f8;

  cursor:pointer;

  font-size:17px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.windowButton:hover{
  background:#e7ebf1;
}

.windowBody{
  width:100%;
  height:calc(100% - 58px);
  padding:16px;

  overflow:auto;
}

/* =========================
   ANTECKNING
========================= */

.noteArea{
  width:100%;
  height:100%;

  border:0;
  outline:0;
  resize:none;

  font-size:18px;
  line-height:1.55;

  color:#172033;
  background:white;
}

/* =========================
   REDIGERBAR TEXT
========================= */

.editor{
  width:100%;
  min-height:150px;

  padding:14px;

  border:1px solid #dfe4ec;
  border-radius:12px;

  outline:none;

  font-size:17px;
  line-height:1.5;

  background:#fff;
}

.editor:focus{
  border-color:#aeb8c9;
  box-shadow:0 0 0 3px rgba(100,120,160,.08);
}

.editor img{
  max-width:100%;
  height:auto;

  border-radius:10px;
  margin:8px 0;

  display:block;
}

/* =========================
   REDIGERINGSKNAPPAR
========================= */

.editToolbar{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-bottom:10px;
}

.editButton{
  border:1px solid #dce1e8;

  background:#f7f8fa;

  padding:8px 11px;

  border-radius:9px;

  cursor:pointer;

  font-size:13px;
}

.editButton:hover{
  background:#eceff4;
}

/* =========================
   DAGENS PLAN
========================= */

.dayHeading{
  width:100%;

  padding:10px 12px;

  margin-bottom:10px;

  border:1px solid #e1e5eb;
  border-radius:10px;

  font-size:22px;
  font-weight:700;

  outline:none;
}

.dayHeading:focus{
  border-color:#aeb8c9;
}

.dayDate{
  color:#687386;
  margin-bottom:12px;
}

/* =========================
   NU
========================= */

.nuSubject{
  width:100%;

  padding:10px 12px;

  border:1px solid #e1e5eb;
  border-radius:10px;

  font-size:20px;
  font-weight:700;

  outline:none;

  margin-bottom:10px;
}

.nuSubject:focus{
  border-color:#aeb8c9;
}

/* =========================
   LÄNKAR
========================= */

.linkList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.linkItem{
  display:flex;
  align-items:center;
  gap:10px;

  padding:11px 13px;

  background:#f6f8fb;

  border-radius:10px;

  text-decoration:none;

  color:#172033;

  border:1px solid #e6e9ef;
}

.linkItem:hover{
  background:#edf1f6;
}

/* =========================
   SCHEMA
========================= */

.schedule{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.scheduleRow{
  display:grid;
  grid-template-columns:80px 1fr 40px 35px;

  align-items:center;

  gap:7px;
}

.scheduleInput{
  min-width:0;

  padding:8px;

  border:1px solid #dfe4eb;
  border-radius:8px;

  outline:none;
}

.scheduleInput:focus{
  border-color:#aeb8c9;
}

.scheduleDelete{
  border:0;

  width:30px;
  height:30px;

  border-radius:8px;

  background:#f2f4f7;

  cursor:pointer;
}

/* =========================
   KLOCKA
========================= */

.clock{
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:8px;
}

.clockTime{
  font-size:55px;
  font-weight:700;
}

.clockDate{
  font-size:17px;
  color:#6c7585;
}

/* =========================
   TIMER
========================= */

.timer{
  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:15px;
}

.timerDisplay{
  font-size:60px;
  font-weight:700;
}

.timerControls{
  display:flex;
  gap:8px;
}

.timerControls button{
  padding:9px 14px;

  border:1px solid #dce1e8;
  border-radius:9px;

  background:#f6f8fa;

  cursor:pointer;
}

/* =========================
   BAKGRUNDSMENY
========================= */

#backgroundPanel{
  position:fixed;

  top:0;
  right:0;

  width:min(780px,100vw);
  height:100vh;

  background:#fff;

  z-index:20000;

  box-shadow:-8px 0 35px rgba(0,0,0,.18);

  display:none;

  overflow:auto;
}

#backgroundPanel.open{
  display:block;
}

.bgHeader{
  position:sticky;
  top:0;

  z-index:5;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:22px 25px;

  background:white;

  border-bottom:1px solid #e8ebef;
}

.bgHeader h2{
  margin:0;

  font-size:25px;
}

.bgClose{
  width:44px;
  height:44px;

  border:1px solid #e0e4ea;
  border-radius:50%;

  background:white;

  cursor:pointer;

  font-size:25px;
}

.bgSection{
  padding:20px 25px 5px;
}

.bgSectionTitle{
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
}

.bgGrid{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:12px;
}

.bgCard{
  height:100px;

  border-radius:9px;

  overflow:hidden;

  cursor:pointer;

  position:relative;

  border:2px solid transparent;

  background-size:cover;
  background-position:center;
}

.bgCard:hover{
  border-color:#75839a;
}

.bgCard img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.bgAdd{
  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:7px;

  background:#f4f6f9;

  border:2px dashed #c8ced8;

  color:#536074;

  font-weight:600;
}

.bgAdd span:first-child{
  font-size:28px;
}

/* =========================
   FILER
========================= */

.hiddenFile{
  display:none;
}

/* =========================
   DAGENS SCHEMA
========================= */

.daySchedule{
  margin-top:14px;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.dayScheduleRow{
  display:grid;

  grid-template-columns:75px 1fr 38px;

  gap:8px;

  align-items:center;
}

.dayScheduleRow input{
  min-width:0;

  border:1px solid #dfe4eb;

  border-radius:9px;

  padding:9px;

  outline:none;
}

.dayScheduleRow input:focus{
  border-color:#aeb8c9;
}

.dayScheduleRow button{
  width:32px;
  height:32px;

  border:0;
  border-radius:8px;

  background:#f1f3f6;

  cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  #toolbar{
    max-width:95vw;

    overflow-x:auto;

    justify-content:flex-start;
  }

  .tool{
    flex:0 0 58px;
  }

  .bgGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .window{
    width:90vw;
    height:65vh;
  }
}
</style>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   LAGRING
===================================================== */

const STORAGE_KEY = "klassrumstavlan-v7";

let state = {
  windows: {},
  backgrounds: {
    type:"gradient",
    value:"linear-gradient(135deg,#dfe8e8,#8ea7a7)"
  }
};

try{

  const saved = localStorage.getItem(STORAGE_KEY);

  if(saved){
    state = JSON.parse(saved);
  }

}catch(e){

  console.log("Kunde inte läsa sparad information.");

}


/* =====================================================
   ID
===================================================== */

function uid(prefix="id"){

  return prefix + "-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).substring(2,8);

}


/* =====================================================
   SPARA
===================================================== */

function saveState(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  }catch(e){

    console.log("Kunde inte spara.");

  }

}


/* =====================================================
   INDEXERA FÖNSTER
===================================================== */

function registerWindow(win,type){

  const id = win.dataset.id;

  if(!state.windows[id]){

    state.windows[id] = {

      type:type,

      x:win.offsetLeft,
      y:win.offsetTop,

      width:win.offsetWidth,
      height:win.offsetHeight,

      minimized:false

    };

  }

}


/* =====================================================
   SKAPA FÖNSTER
===================================================== */

function createWindow(type,title,icon){

  const win = document.createElement("div");

  win.className = "window";

  win.dataset.id = uid("window");
  win.dataset.type = type;

  const existing =
    Object.keys(state.windows).length;

  win.style.left =
    (80 + existing * 25) + "px";

  win.style.top =
    (70 + existing * 25) + "px";

  win.innerHTML = `

    <div class="windowHeader">

      <div class="windowTitle">

        <span class="windowTitleIcon">
          ${icon}
        </span>

        <span>
          ${title}
        </span>

      </div>

      <div class="windowButtons">

        <button
          class="windowButton minimizeButton"
          title="Minimera">
          −
        </button>

        <button
          class="windowButton closeButton"
          title="Stäng">
          ×
        </button>

      </div>

    </div>

    <div class="windowBody"></div>

  `;

  document.body.appendChild(win);

  registerWindow(win,type);

  setupWindow(win);

  return win;

}


/* =====================================================
   FLYTTA FÖNSTER
===================================================== */

function setupWindow(win){

  const header =
    win.querySelector(".windowHeader");

  const minimize =
    win.querySelector(".minimizeButton");

  const close =
    win.querySelector(".closeButton");


  /* DRAG */

  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  header.addEventListener("mousedown",e=>{

    if(
      e.target.closest(".windowButton")
    ){
      return;
    }

    dragging = true;

    startX = e.clientX;
    startY = e.clientY;

    startLeft = win.offsetLeft;
    startTop = win.offsetTop;

    document.body.style.userSelect =
      "none";

  });


  document.addEventListener("mousemove",e=>{

    if(!dragging) return;

    const dx =
      e.clientX - startX;

    const dy =
      e.clientY - startY;

    win.style.left =
      Math.max(0,startLeft + dx) + "px";

    win.style.top =
      Math.max(0,startTop + dy) + "px";

  });


  document.addEventListener("mouseup",()=>{

    if(!dragging) return;

    dragging = false;

    document.body.style.userSelect =
      "";

    saveWindowState(win);

  });


  /* MINIMERA */

  minimize.addEventListener("click",()=>{

    win.classList.toggle("minimized");

    saveWindowState(win);

  });


  /* STÄNG */

  close.addEventListener("click",()=>{

    delete state.windows[win.dataset.id];

    win.remove();

    saveState();

  });


  /* RESIZE */

  if(window.ResizeObserver){

    const observer =
      new ResizeObserver(()=>{

        if(!win.classList.contains("minimized")){

          saveWindowState(win);

        }

      });

    observer.observe(win);

  }

}


/* =====================================================
   SPARA FÖNSTERPOSITION
===================================================== */

function saveWindowState(win){

  const id =
    win.dataset.id;

  if(!state.windows[id]) return;

  state.windows[id] = {

    ...state.windows[id],

    x:win.offsetLeft,

    y:win.offsetTop,

    width:win.offsetWidth,

    height:win.offsetHeight,

    minimized:
      win.classList.contains("minimized")

  };

  saveState();

}


/* =====================================================
   ANTECKNING
===================================================== */

function createNote(data=null){

  const win =
    createWindow(
      "note",
      "Anteckning",
      "📝"
    );

  const body =
    win.querySelector(".windowBody");

  body.innerHTML = `

    <textarea
      class="noteArea"
      placeholder="Skriv din anteckning här..."
    ></textarea>

  `;

  const area =
    body.querySelector(".noteArea");

  if(data?.text){

    area.value =
      data.text;

  }

  area.addEventListener("input",()=>{

    state.windows[win.dataset.id].data = {

      text:area.value

    };

    saveState();

  });

}


/* =====================================================
   REDIGERINGSVERKTYG
===================================================== */

function editorToolbar(editor){

  const bar =
    document.createElement("div");

  bar.className =
    "editToolbar";

  bar.innerHTML = `

    <button class="editButton">
      B
    </button>

    <button class="editButton">
      I
    </button>

    <button class="editButton">
      🔗 Lägg till länk
    </button>

    <button class="editButton">
      🖼️ Lägg till bild
    </button>

    <button class="editButton">
      • Lista
    </button>

  `;

  const buttons =
    bar.querySelectorAll("button");

  buttons[0].onclick=()=>{
    document.execCommand("bold");
    editor.focus();
  };

  buttons[1].onclick=()=>{
    document.execCommand("italic");
    editor.focus();
  };

  buttons[2].onclick=()=>{
    addLink(editor);
  };

  buttons[3].onclick=()=>{
    addImageToEditor(editor);
  };

  buttons[4].onclick=()=>{
    document.execCommand("insertUnorderedList");
    editor.focus();
  };

  return bar;

}


/* =====================================================
   LÄNK
===================================================== */

function addLink(editor){

  const url =
    prompt(
      "Klistra in länken:",
      "https://"
    );

  if(!url) return;

  const text =
    prompt(
      "Vad ska länken heta?",
      "Öppna länk"
    );

  if(!text) return;

  editor.focus();

  const html = `

    <a
      href="${escapeAttribute(url)}"
      target="_blank"
      rel="noopener"
    >
      🔗 ${escapeHtml(text)}
    </a>

  `;

  document.execCommand(
    "insertHTML",
    false,
    html
  );

  editor.dispatchEvent(
    new Event("input")
  );

}


/* =====================================================
   BILD I EDITOR
===================================================== */

function addImageToEditor(editor){

  const input =
    document.createElement("input");

  input.type="file";
  input.accept="image/*";

  input.onchange=async()=>{

    const file =
      input.files[0];

    if(!file) return;

    const data =
      await resizeImage(file);

    const id =
      await saveImageToDB(
        data,
        "support"

/* =====================================================
   TIMER
===================================================== */

function createTimer(){

  const win =
    createWindow(
      "timer",
      "Timer",
      "⏱️"
    );


  const body =
    win.querySelector(".windowBody");


  body.innerHTML = `

    <div class="timer">

      <div class="timerDisplay">
        05:00
      </div>

      <div class="timerControls">

        <button data-min="1">
          1 min
        </button>

        <button data-min="5">
          5 min
        </button>

        <button data-min="10">
          10 min
        </button>

        <button data-action="start">
          ▶ Start
        </button>

        <button data-action="reset">
          ↺
        </button>

      </div>

    </div>

  `;


  let seconds=300;
  let interval=null;


  const display =
    body.querySelector(
      ".timerDisplay"
    );


  function render(){

    const min =
      Math.floor(seconds/60);

    const sec =
      seconds%60;

    display.textContent =
      String(min).padStart(2,"0")
      + ":" +
      String(sec).padStart(2,"0");

  }


  body
    .querySelectorAll(
      "[data-min]"
    )
    .forEach(button=>{

      button.onclick=()=>{

        seconds =
          Number(button.dataset.min)*60;

        render();

      };

    });


  body
    .querySelector(
      "[data-action='start']"
    )
    .onclick=()=>{

      if(interval) return;

      interval =
        setInterval(()=>{

          if(seconds<=0){

            clearInterval(interval);

            interval=null;

            return;

          }

          seconds--;

          render();

        },1000);

    };


  body
    .querySelector(
      "[data-action='reset']"
    )
    .onclick=()=>{

      clearInterval(interval);

      interval=null;

      seconds=300;

      render();

    };


  render();

}

/* =====================================================
   IDB
===================================================== */

let dbPromise = null;


function getDB(){

  if(dbPromise){
    return dbPromise;
  }


  dbPromise =
    new Promise((resolve,reject)=>{

      const request =
        indexedDB.open(
          "KlassrumstavlanDB",
          1
        );


      request.onupgradeneeded =
        function(){

          const db =
            request.result;


          if(
            !db.objectStoreNames.contains(
              "images"
            )
          ){

            db.createObjectStore(
              "images",
              {
                keyPath:"id"
              }
            );

          }

        };


      request.onsuccess =
        ()=>resolve(
          request.result
        );


      request.onerror =
        ()=>reject(
          request.error
        );

    });


  return dbPromise;

}


/* =====================================================
   SPARA BILD
===================================================== */

async function saveImageToDB(
  data,
  type
){

  const db =
    await getDB();


  const id =
    uid(type);


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          "images",
          "readwrite"
        );


      tx.objectStore(
        "images"
      ).put({

        id:id,

        type:type,

        data:data,

        created:Date.now()

      });


      tx.oncomplete =
        ()=>resolve(id);


      tx.onerror =
        ()=>reject(
          tx.error
        );

    }
  );

}


/* =====================================================
   HÄMTA BILDER
===================================================== */

async function getImages(type){

  const db =
    await getDB();


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          "images",
          "readonly"
        );


      const request =
        tx.objectStore(
          "images"
        ).getAll();


      request.onsuccess=()=>{

        resolve(
          request.result
            .filter(
              image =>
                image.type===type
            )
        );

      };


      request.onerror =
        ()=>reject(
          request.error
        );

    }
  );

}

async function deleteImage(id){

  const db =
    await getDB();


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          "images",
          "readwrite"
        );


      tx.objectStore(
        "images"
      ).delete(id);


      tx.oncomplete =
        ()=>resolve();


      tx.onerror =
        ()=>reject(
          tx.error
        );

    }
  );

}

/* =====================================================
   BILDRESIZE
===================================================== */

function resizeImage(
  file,
  maxWidth=1400
){

  return new Promise(
    resolve=>{

      const reader =
        new FileReader();


      reader.onload=e=>{

        const img =
          new Image();


        img.onload=()=>{

          let width =
            img.width;

          let height =
            img.height;


          if(width>maxWidth){

            height =
              Math.round(
                height *
                maxWidth /
                width
              );

            width =
              maxWidth;

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .82
            )
          );

        };


        img.src =
          e.target.result;

      };


      reader.readAsDataURL(file);

    }
  );

}

  const all =

          image.id ===
          img.dataset.imageId
      );

      img.src =
        item.data;

/* =====================================================
   HTML SÄKERHET
===================================================== */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(text){

  return escapeHtml(
    text || ""
  );

}

/* =====================================================
   LÄS IN SPARADE FÖNSTER
===================================================== */

async function restoreWindows(){

  const windows =
    state.windows || {};


  for(
    const [id,data]
    of Object.entries(windows)
  ){

    let win=null;


    if(data.type==="note"){

      createNote(data.data);

    }

    else if(data.type==="day"){

      createDay(data.data);

    }

    else if(data.type==="nu"){

      createNU(data.data);

    }

    else if(data.type==="schedule"){

      createSchedule(data.data);

    }

    else if(data.type==="links"){

      createLinks();

    }

    else if(data.type==="clock"){

      createClock();

    }

    else if(data.type==="timer"){

      createTimer();

    }


    /*

      Äldre sparade fönster
      behöver inte återanvända
      samma ID.

    */

  }


  /* återställ bilder */

  document
    .querySelectorAll(
      ".editor"
    )
    .forEach(editor=>{

      restoreEditorImages(
        editor
      );

    });

}


/* =====================================================
   STANDARD FÖNSTER
===================================================== */

async function initialize(){

  await loadSavedBackground();


  const existing =
    Object.keys(
      state.windows || {}
    ).length;


  if(!existing){

    createDay();

    createSchedule();

    createClock();

  }else{

    await restoreWindows();

  }

}
