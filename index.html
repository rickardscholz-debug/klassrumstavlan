<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Klassrumstavlan</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: #202735;
}

body {
    background: #547890 center / cover no-repeat;
}

/* VIDEO SOM BAKGRUND */

#bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    display: none;
}

/* ARBETSYTA */

#board {
    position: fixed;
    inset: 0 0 112px 0;
}

/* WIDGETS */

.widget {
    position: absolute;

    min-width: 220px;
    min-height: 150px;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.28);

    resize: both;
    overflow: hidden;

    border: 1px solid rgba(255,255,255,.7);
}

/* RUBRIK PÅ WIDGET */

.head {
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 10px;

    background: rgba(255,255,255,.90);

    cursor: move;

    font-weight: 700;
    font-size: 14px;
}

.close {
    border: 0;
    background: transparent;

    font-size: 20px;

    cursor: pointer;
}

.body {
    height: calc(100% - 38px);

    padding: 13px;

    overflow: auto;
}

/* ============================= */
/* POST-IT */
/* ============================= */

.note {
    background: #fff6c8;
}

.note .head {
    background: #fff0a6;
}

.note .body {
    padding: 0;
}

.note textarea {

    width: 100%;
    height: 100%;

    border: 0;
    outline: 0;

    resize: none;

    background: transparent;

    padding: 20px;

    font-size: 21px;
    line-height: 1.5;

    color: #4c4c43;
}

/* ============================= */
/* KLOCKA */
/* ============================= */

.clockWidget .body {

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 58px;

    font-weight: 700;
}

/* ============================= */
/* DAGEN */
/* ============================= */

.dayWidget .today {

    font-size: 29px;

    font-weight: 800;

    text-transform: capitalize;
}

.dayWidget .date {

    font-size: 22px;

    margin-top: 7px;
}

/* ============================= */
/* LÄNKAR */
/* ============================= */

.linksGrid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.serviceLink {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 58px;

    padding: 14px 10px;

    border-radius: 13px;

    background: #f0f3f7;

    font-size: 16px;

    font-weight: 700;

    color: #202735;

    text-decoration: none;

    text-align: center;
}

.serviceLink:hover {

    background: #dce7f2;

    transform: scale(1.02);
}

/* ============================= */
/* BILDER VIDEO PDF */
/* ============================= */

.imageWidget .body,
.videoWidget .body,
.pdfWidget .body {

    padding: 0;

    background: #111;
}

.imageWidget img,
.videoWidget video,
.pdfWidget iframe {

    width: 100%;
    height: 100%;

    object-fit: contain;

    border: 0;
}

/* ============================= */
/* TIMER */
/* ============================= */

.timerNum {

    font-size: 48px;

    text-align: center;

    font-weight: 800;

    margin-bottom: 10px;
}

.row {

    display: flex;

    gap: 7px;
}

.row input {

    width: 90px;

    padding: 8px;
}

.row button {

    flex: 1;
}

button.action {

    border: 0;

    border-radius: 9px;

    padding: 9px 11px;

    background: #334155;

    color: white;

    cursor: pointer;
}

/* ============================= */
/* NEDRE VERKTYGSRAD */
/* ============================= */

.toolbar {

    position: fixed;

    z-index: 1000;

    left: 50%;

    bottom: 18px;

    transform: translateX(-50%);

    height: 78px;

    max-width: 96vw;

    background: white;

    border-radius: 19px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.30);

    display: flex;

    align-items: center;

    gap: 3px;

    padding: 7px 10px;

    overflow-x: auto;
}

/* KNAPPAR */

.tool {

    min-width: 76px;

    height: 64px;

    border: 0;

    background: transparent;

    border-radius: 12px;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    color: #202735;

    font-size: 12px;

    white-space: nowrap;
}

.tool:hover {

    background: #edf2f8;
}

.ico {

    font-size: 27px;

    line-height: 27px;
}

.filetool input {

    display: none;
}

/* ============================= */
/* MER-MENY */
/* ============================= */

.moreMenu {

    position: fixed;

    z-index: 1100;

    bottom: 105px;

    left: 50%;

    transform: translateX(-50%);

    display: none;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.30);

    padding: 10px;

    gap: 6px;
}

.moreMenu.open {

    display: flex;
}

input,
textarea {

    font: inherit;
}

@media(max-width:700px) {

    .toolbar {

        left: 7px;

        right: 7px;

        transform: none;
    }

    .tool {

        min-width: 68px;
    }
}

</style>
</head>


<body>


<video
    id="bgVideo"
    muted
    loop
    playsinline>
</video>


<!-- ARBETSYTA -->

<div id="board"></div>


<!-- NEDRE VERKTYGSRAD -->

<div class="toolbar">


<button
    class="tool"
    id="btnNote">

<span class="ico">📝</span>

<span>Anteckning</span>

</button>


<button
    class="tool"
    id="btnDay">

<span class="ico">📅</span>

<span>Dagen</span>

</button>


<button
    class="tool"
    id="btnLinks">

<span class="ico">🔗</span>

<span>Länkar</span>

</button>


<button
    class="tool"
    id="btnClock">

<span class="ico">🕒</span>

<span>Klocka</span>

</button>


<button
    class="tool"
    id="btnTimer">

<span class="ico">⌛</span>

<span>Timer</span>

</button>


<label class="tool filetool">

<span class="ico">🖼️</span>

<span>Bild</span>

<input
    id="imageFile"
    type="file"
    accept="image/*">

</label>


<label class="tool filetool">

<span class="ico">🏞️</span>

<span>Bakgrund</span>

<input
    id="bgFile"
    type="file"
    accept="image/*,video/mp4,video/webm,video/ogg">

</label>


<button
    class="tool"
    id="more">

<span class="ico">▦</span>

<span>Mer</span>

</button>


</div>


<!-- MER -->

<div
    class="moreMenu"
    id="moreMenu">


<label class="tool filetool">

<span class="ico">🎞️</span>

<span>Video</span>

<input
    id="videoFile"
    type="file"
    accept="video/mp4,video/webm,video/ogg">

</label>


<label class="tool filetool">

<span class="ico">📄</span>

<span>PDF</span>

<input
    id="pdfFile"
    type="file"
    accept="application/pdf">

</label>


<button
    class="tool"
    id="clearBg">

<span class="ico">✖</span>

<span>Bakgrund</span>

</button>


<button
    class="tool"
    id="reset">

<span class="ico">↺</span>

<span>Återställ</span>

</button>


</div>


<script>

/* ============================= */
/* GRUND */
/* ============================= */

const board =
    document.getElementById("board");

const bgVideo =
    document.getElementById("bgVideo");

const KEY =
    "klassrumstavlan-v8";


let state = {
    widgets: []
};


try {

    const saved =
        localStorage.getItem(KEY);

    if(saved) {

        state =
            JSON.parse(saved);
    }

}
catch(error) {

    state = {
        widgets: []
    };
}


let backgroundURL = null;


/* ============================= */
/* LÄNKAR */
/* ============================= */

const linkList = [

    [
        "🧩",
        "Skolon",
        "https://skolon.com/"
    ],

    [
        "▶️",
        "UR Play",
        "https://urplay.se/"
    ],

    [
        "📺",
        "SVT Play",
        "https://www.svtplay.se/"
    ],

    [
        "🎬",
        "SLI",
        "https://sliplay.se/"
    ],

    [
        "🔴",
        "YouTube",
        "https://www.youtube.com/"
    ]

];


/* ============================= */
/* SPARA */
/* ============================= */

function collect(widget) {

    const data = {};

    widget
        .querySelectorAll("[data-k]")
        .forEach(element => {

            data[element.dataset.k] =
                element.value;

        });

    return data;
}


function save() {

    state.widgets =
        [...document.querySelectorAll(".widget")]
        .map(widget => ({

            id:
                widget.id,

            type:
                widget.dataset.type,

            x:
                widget.offsetLeft,

            y:
                widget.offsetTop,

            width:
                widget.offsetWidth,

            height:
                widget.offsetHeight,

            data:
                collect(widget)

        }));


    try {

        localStorage.setItem(
            KEY,
            JSON.stringify(state)
        );

    }
    catch(error) {

        console.log(
            "Kunde inte spara.",
            error
        );
    }

}


/* ============================= */
/* SKAPA WIDGET */
/* ============================= */

function add(type, saved = {}) {


    const widget =
        document.createElement("section");


    widget.className =
        "widget " +
        type +
        "Widget " +
        (type === "note"
            ? "note"
            : "");


    widget.dataset.type =
        type;


    widget.id =
        saved.id ||
        "widget-" +
        Date.now() +
        "-" +
        Math.floor(Math.random()*10000);


    const sizes = {

        note:
            [340,390],

        day:
            [350,190],

        links:
            [410,320],

        clock:
            [310,170],

        timer:
            [330,210],

        image:
            [480,350],

        video:
            [480,350],

        pdf:
            [480,400]

    };


    const size =
        sizes[type] ||
        [330,220];


    widget.style.left =
        (saved.x ??
        60 + Math.random()*250)
        + "px";


    widget.style.top =
        (saved.y ??
        50 + Math.random()*140)
        + "px";


    widget.style.width =
        (saved.width ||
        size[0])
        + "px";


    widget.style.height =
        (saved.height ||
        size[1])
        + "px";


    const data =
        saved.data || {};


    const titles = {

        note:
            "Anteckning",

        day:
            "Dagen",

        links:
            "Länkar",

        clock:
            "Klocka",

        timer:
            "Timer",

        image:
            "Bild",

        video:
            "Video",

        pdf:
            "PDF"

    };


    let content = "";


/* ANTECKNING */

    if(type === "note") {

        content = `

<textarea
    data-k="text"
    placeholder="Gör en anteckning...">${data.text || ""}</textarea>

        `;
    }


/* DAGEN */

    if(type === "day") {

        content = `

<div class="today"></div>

<div class="date"></div>

        `;
    }


/* LÄNKAR */

    if(type === "links") {

        content =
            '<div class="linksGrid">' +

            linkList.map(link => `

<a
    class="serviceLink"
    href="${link[2]}"
    target="_blank"
    rel="noopener noreferrer">

${link[0]} ${link[1]}

</a>

            `).join("") +

            "</div>";
    }


/* KLOCKA */

    if(type === "clock") {

        content = `

<div class="clockText">
--:--
</div>

        `;
    }


/* TIMER */

    if(type === "timer") {

        content = `

<div class="timerNum">
05:00
</div>

<div class="row">

<input
    data-k="minutes"
    type="number"
    min="1"
    value="${data.minutes || 5}">

<button
    class="action start">

Start

</button>

<button
    class="action stop">

Stopp

</button>

</div>

        `;
    }


/* BILD */

    if(type === "image") {

        content = `

<img
    alt="Infogad bild">

        `;
    }


/* VIDEO */

    if(type === "video") {

        content = `

<video
    controls
    playsinline>
</video>

        `;
    }


/* PDF */

    if(type === "pdf") {

        content = `

<iframe
    title="PDF">
</iframe>

        `;
    }


/* BYGG RUTAN */

    widget.innerHTML = `

<div class="head">

<span>
${titles[type]}
</span>

<button class="close">
×
</button>

</div>

<div class="body">

${content}

</div>

    `;


    board.appendChild(widget);


    wire(widget);

    makeDraggable(widget);

    save();


    return widget;
}


/* ============================= */
/* WIDGET-FUNKTIONER */
/* ============================= */

function wire(widget) {


/* STÄNG */

    widget
        .querySelector(".close")
        .addEventListener(
            "click",
            () => {

                if(widget._url) {

                    URL.revokeObjectURL(
                        widget._url
                    );
                }

                widget.remove();

                save();
            }
        );


/* SPARA TEXT */

    widget
        .querySelectorAll("[data-k]")
        .forEach(element => {

            element.addEventListener(
                "input",
                save
            );

        });


/* DAGEN */

    if(
        widget.dataset.type ===
        "day"
    ) {

        const weekday =
            widget.querySelector(
                ".today"
            );

        const date =
            widget.querySelector(
                ".date"
            );


        function updateDay() {

            const now =
                new Date();


            weekday.textContent =
                now.toLocaleDateString(
                    "sv-SE",
                    {
                        weekday:
                            "long"
                    }
                );


            date.textContent =
                now.toLocaleDateString(
                    "sv-SE",
                    {
                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );

        }


        updateDay();

        setInterval(
            updateDay,
            60000
        );
    }


/* KLOCKA */

    if(
        widget.dataset.type ===
        "clock"
    ) {

        const clock =
            widget.querySelector(
                ".clockText"
            );


        function updateClock() {

            clock.textContent =
                new Date()
                .toLocaleTimeString(
                    "sv-SE",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );
    }


/* TIMER */

    if(
        widget.dataset.type ===
        "timer"
    ) {

        let timer = null;

        let seconds = 0;


        const output =
            widget.querySelector(
                ".timerNum"
            );


        const input =
            widget.querySelector(
                '[data-k="minutes"]'
            );


        function drawTimer() {

            const minutes =
                Math.floor(
                    seconds / 60
                );


            const remaining =
                seconds % 60;


            output.textContent =
                String(minutes)
                    .padStart(2,"0")
                +
                ":"
                +
                String(remaining)
                    .padStart(2,"0");
        }


        widget
            .querySelector(".start")
            .addEventListener(
                "click",
                () => {

                    clearInterval(
                        timer
                    );


                    seconds =
                        Math.max(
                            1,
                            Number(
                                input.value
                            ) || 5
                        )
                        * 60;


                    drawTimer();


                    timer =
                        setInterval(
                            () => {

                                seconds--;

                                drawTimer();


                                if(
                                    seconds <= 0
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    alert(
                                        "Tiden är slut!"
                                    );
                                }

                            },
                            1000
                        );

                }
            );


        widget
            .querySelector(".stop")
            .addEventListener(
                "click",
                () => {

                    clearInterval(
                        timer
                    );

                }
            );
    }

}


/* ============================= */
/* FLYTTA WIDGET */
/* ============================= */

function makeDraggable(widget) {


    const handle =
        widget.querySelector(
            ".head"
        );


    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    handle.addEventListener(
        "pointerdown",
        event => {


            if(
                event.target
                .closest("button")
            ) {

                return;
            }


            dragging = true;


            startX =
                event.clientX;

            startY =
                event.clientY;


            originalX =
                widget.offsetLeft;

            originalY =
                widget.offsetTop;


            handle.setPointerCapture(
                event.pointerId
            );

        }
    );


    handle.addEventListener(
        "pointermove",
        event => {


            if(!dragging) {

                return;
            }


            widget.style.left =
                Math.max(
                    0,
                    originalX +
                    event.clientX -
                    startX
                )
                + "px";


            widget.style.top =
                Math.max(
                    0,
                    originalY +
                    event.clientY -
                    startY
                )
                + "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        () => {

            dragging = false;

            save();

        }
    );


    new ResizeObserver(
        save
    ).observe(
        widget
    );

}


/* ============================= */
/* NEDRE KNAPPAR */
/* ============================= */

document
.getElementById("btnNote")
.addEventListener(
    "click",
    () => add("note")
);


document
.getElementById("btnDay")
.addEventListener(
    "click",
    () => add("day")
);


document
.getElementById("btnLinks")
.addEventListener(
    "click",
    () => add("links")
);


document
.getElementById("btnClock")
.addEventListener(
    "click",
    () => add("clock")
);


document
.getElementById("btnTimer")
.addEventListener(
    "click",
    () => add("timer")
);


/* ============================= */
/* BILD */
/* ============================= */

document
.getElementById("imageFile")
.addEventListener(
    "change",
    event => {


        const file =
            event.target.files[0];


        if(!file) {

            return;
        }


        const widget =
            add("image");


        const url =
            URL.createObjectURL(
                file
            );


        widget._url =
            url;


        widget
            .querySelector("img")
            .src =
            url;


        event.target.value =
            "";

    }
);


/* ============================= */
/* VIDEO */
/* ============================= */

document
.getElementById("videoFile")
.addEventListener(
    "change",
    event => {


        const file =
            event.target.files[0];


        if(!file) {

            return;
        }


        const widget =
            add("video");


        const url =
            URL.createObjectURL(
                file
            );


        widget._url =
            url;


        const video =
            widget.querySelector(
                "video"
            );


        video.src =
            url;


        video.load();


        event.target.value =
            "";

    }
);


/* ============================= */
/* PDF */
/* ============================= */

document
.getElementById("pdfFile")
.addEventListener(
    "change",
    event => {


        const file =
            event.target.files[0];


        if(!file) {

            return;
        }


        const widget =
            add("pdf");


        const url =
            URL.createObjectURL(
                file
            );


        widget._url =
            url;


        widget
            .querySelector("iframe")
            .src =
            url;


        event.target.value =
            "";

    }
);


/* ============================= */
/* BAKGRUND */
/* ============================= */

document
.getElementById("bgFile")
.addEventListener(
    "change",
    event => {


        const file =
            event.target.files[0];


        if(!file) {

            return;
        }


        if(backgroundURL) {

            URL.revokeObjectURL(
                backgroundURL
            );
        }


        backgroundURL =
            URL.createObjectURL(
                file
            );


        document.body
            .style
            .backgroundImage =
            "none";


        bgVideo.pause();

        bgVideo.style.display =
            "none";


        bgVideo.removeAttribute(
            "src"
        );


/* BILDBAKGRUND */

        if(
            file.type
            .startsWith("image/")
        ) {

            document.body
                .style
                .backgroundImage =
                `url("${backgroundURL}")`;

        }


/* VIDEOBACKGRUND */

        else if(
            file.type
            .startsWith("video/")
        ) {

            bgVideo.src =
                backgroundURL;


            bgVideo.style.display =
                "block";


            bgVideo.load();


            bgVideo.play()
                .catch(
                    () => {}
                );
        }


        event.target.value =
            "";

    }
);


/* ============================= */
/* MER */
/* ============================= */

document
.getElementById("more")
.addEventListener(
    "click",
    () => {

        document
            .getElementById(
                "moreMenu"
            )
            .classList
            .toggle("open");

    }
);


/* ============================= */
/* TA BORT BAKGRUND */
/* ============================= */

document
.getElementById("clearBg")
.addEventListener(
    "click",
    () => {


        document.body
            .style
            .backgroundImage =
            "";


        bgVideo.pause();


        bgVideo.style.display =
            "none";


        bgVideo.removeAttribute(
            "src"
        );

    }
);


/* ============================= */
/* ÅTERSTÄLL */
/* ============================= */

document
.getElementById("reset")
.addEventListener(
    "click",
    () => {


        const answer =
            confirm(
                "Vill du återställa hela tavlan?"
            );


        if(answer) {

            localStorage.removeItem(
                KEY
            );


            location.reload();
        }

    }
);


/* ============================= */
/* ÅTERSKAPA SPARADE WIDGETS */
/* ============================= */

if(
    state.widgets &&
    Array.isArray(
        state.widgets
    )
) {

    state.widgets
        .forEach(
            widget => {

                add(
                    widget.type,
                    widget
                );

            }
        );
}

</script>


</body>
</html>
