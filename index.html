<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassrumstavlan</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden;color:#202735}
body{background:#6b8798 center/cover no-repeat}
#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;display:none}
#board{position:fixed;inset:0 0 112px}

.widget{
 position:absolute;min-width:240px;min-height:150px;width:360px;height:220px;
 background:#fffffff2;border:1px solid #ffffffaa;border-radius:18px;
 box-shadow:0 12px 35px #0004;resize:both;overflow:hidden;z-index:10
}
.head{
 height:44px;display:flex;align-items:center;gap:8px;padding:7px 10px;
 background:#f3f6f8e8;cursor:move;font-weight:800;font-size:14px;
 border-bottom:1px solid #dfe6eb
}
.head .title{display:flex;align-items:center;gap:7px}
.head .close,.head .mini{
 margin-left:auto;border:0;background:transparent;font-size:19px;cursor:pointer;
 width:28px;height:28px;border-radius:8px
}
.head .mini{margin-left:auto;font-size:16px}
.head .mini:hover,.head .close:hover{background:#e3eaf0}
.body{height:calc(100% - 44px);padding:13px;overflow:auto}
.widget.minimized{height:44px!important;min-height:44px!important;resize:none}
.widget.minimized .body{display:none}
.widget.minimized .close{margin-left:0}
.widget.minimized .mini{margin-left:auto}

.note .body{padding:0}
.note textarea{
 width:100%;height:100%;border:0;outline:0;resize:none;background:#fffdf1;
 padding:18px;font:400 20px/1.5 Arial,sans-serif;color:#4c4c43
}
.clockText,.timerNum{
 display:flex;align-items:center;justify-content:center;
 height:100%;font-size:54px;font-weight:850
}
.today{font-size:29px;font-weight:850;text-transform:capitalize}
.date{font-size:21px;margin-top:6px}
.muted{color:#64748b;font-size:12px}

.linksGrid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.serviceLink{
 display:flex;align-items:center;justify-content:center;
 padding:14px 9px;border:0;border-radius:12px;background:#edf2f6;
 color:#202735;font-size:15px;font-weight:750;
 text-decoration:none;text-align:center
}
.serviceLink:hover{background:#dfe8ee}

.row{
 display:flex;gap:7px;align-items:center;flex-wrap:wrap
}
.row input{
 padding:8px;border:1px solid #cbd5e1;border-radius:9px
}
.action{
 border:0;border-radius:9px;padding:9px 11px;
 background:#334155;color:#fff;cursor:pointer
}
.action.secondary{
 background:#e8eef3;color:#202735
}

.toolbar{
 position:fixed;z-index:1000;left:50%;bottom:18px;
 transform:translateX(-50%);min-height:78px;max-width:96vw;
 background:#fff;border-radius:19px;
 box-shadow:0 10px 35px #0004;display:flex;
 align-items:center;gap:3px;padding:7px 10px;
 overflow-x:auto
}
.tool{
 min-width:76px;height:64px;border:0;background:transparent;
 border-radius:12px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:5px;color:#202735;
 font-size:12px;white-space:nowrap
}
.tool:hover{background:#edf2f8}
.ico{font-size:27px;line-height:27px}
.filetool input{display:none}

.popover{
 position:fixed;z-index:1200;left:50%;bottom:105px;
 transform:translateX(-50%);width:min(850px,94vw);
 max-height:60vh;overflow:auto;background:#fff;
 border-radius:18px;box-shadow:0 15px 45px #0005;
 padding:14px;display:none
}
.popover.open{display:block}
.popHead{
 display:flex;align-items:center;gap:8px;margin-bottom:10px
}
.popHead h3{margin:0;font-size:17px}
.popClose{
 margin-left:auto;border:0;background:#edf2f6;
 border-radius:9px;padding:7px 10px;cursor:pointer
}
.bgCategories{
 display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px
}
.bgCategories button{
 border:0;border-radius:9px;padding:8px 10px;
 background:#edf2f6;cursor:pointer
}
.bgCategories button.active{
 background:#334155;color:#fff
}
.bgGrid{
 display:grid;grid-template-columns:repeat(5,1fr);gap:8px
}
.bgChoice{
 height:82px;border:2px solid transparent;
 border-radius:12px;background-size:cover;
 background-position:center;cursor:pointer;
 box-shadow:inset 0 0 0 999px #0001
}
.bgChoice:hover{border-color:#334155}
.bgLabel{
 display:block;color:#fff;text-shadow:0 1px 4px #000;
 font-weight:800;font-size:12px;padding:8px
}

.scheduleRows{
 display:flex;flex-direction:column;gap:7px
}
.scheduleRow{
 display:grid;grid-template-columns:45px 1fr 105px 34px;
 gap:6px;align-items:center;background:#f8fafc;
 border:1px solid #e2e8f0;border-radius:10px;padding:6px
}
.scheduleIcon{font-size:27px;text-align:center}
.scheduleRow input{
 width:100%;border:1px solid #cbd5e1;
 border-radius:7px;padding:7px
}
.scheduleRow .del{
 border:0;background:transparent;font-size:18px;cursor:pointer
}
.schedulePreview{
 margin-top:10px;border-top:1px solid #e2e8f0;padding-top:9px
}
.scheduleCard{
 display:grid;grid-template-columns:44px 1fr auto;
 align-items:center;gap:8px;
 border-bottom:2px solid #334155;padding:7px 3px
}
.scheduleCard .pic{font-size:28px;text-align:center}
.scheduleCard .subject{font-weight:800}
.scheduleCard .time{
 font-weight:700;color:#475569
}

.nowActions{
 display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px
}
.nowActions button{
 border:0;border-radius:9px;padding:8px 10px;
 background:#edf2f6;cursor:pointer
}
.nowTitle{
 font-size:22px;font-weight:850;margin-bottom:8px
}
.nowNote{
 width:100%;min-height:80px;
 border:1px solid #d6dee5;border-radius:10px;
 padding:10px;resize:vertical
}
.nowLinkList{
 display:flex;flex-direction:column;gap:6px;margin-top:8px
}
.nowLink{
 display:flex;align-items:center;gap:8px;
 background:#edf2f6;border-radius:9px;padding:8px 10px;
 text-decoration:none;color:#202735;font-weight:700
}
.smallInput{
 width:100%;padding:8px;
 border:1px solid #cbd5e1;border-radius:9px
}

@media(max-width:700px){
 .toolbar{left:7px;right:7px;transform:none}
 .tool{min-width:68px}
 .bgGrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<video id="bgVideo" muted loop playsinline></video>

<div id="board"></div>

<div id="backgroundPanel" class="popover">

 <div class="popHead">
  <h3>🏞️ Välj bakgrund</h3>
  <button class="popClose"
          onclick="closePanel('backgroundPanel')">
    Stäng
  </button>
 </div>

 <div class="bgCategories" id="bgCategories"></div>

 <div class="bgGrid" id="bgGrid"></div>

</div>

<div class="toolbar">

 <button class="tool" onclick="add('note')">
  <span class="ico">📝</span>
  <span>Anteckning</span>
 </button>

 <button class="tool" onclick="add('now')">
  <span class="ico">▶️</span>
  <span>NU</span>
 </button>

 <button class="tool" onclick="add('day')">
  <span class="ico">📅</span>
  <span>Dagen</span>
 </button>

 <button class="tool" onclick="add('schedule')">
  <span class="ico">📋</span>
  <span>Schema</span>
 </button>

 <button class="tool" onclick="add('links')">
  <span class="ico">🔗</span>
  <span>Länkar</span>
 </button>

 <button class="tool" onclick="add('clock')">
  <span class="ico">🕒</span>
  <span>Klocka</span>
 </button>

 <button class="tool" onclick="add('timer')">
  <span class="ico">⌛</span>
  <span>Timer</span>
 </button>

 <button class="tool"
         onclick="document.getElementById('backgroundPanel').classList.toggle('open')">
  <span class="ico">🏞️</span>
  <span>Bakgrund</span>
 </button>

 <label class="tool filetool">
  <span class="ico">🖼️</span>
  <span>Bild</span>
  <input id="imageFile" type="file" accept="image/*">
 </label>

 <button class="tool" onclick="fullscreen()">
  <span class="ico">⛶</span>
  <span>Helskärm</span>
 </button>

</div>

<script>

const board=document.getElementById('board');
const bgVideo=document.getElementById('bgVideo');

const KEY='klassrumstavlan-v6';

let state={
 widgets:[],
 background:null
};

try{
 state=JSON.parse(
  localStorage.getItem(KEY) ||
  '{"widgets":[],"background":null}'
 );
}catch(e){}

const esc=s=>String(s??'').replace(
 /[&<>"']/g,
 m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[m])
);

const save=()=>{
 state.widgets=[
  ...document.querySelectorAll('.widget')
 ].map(w=>({
  id:w.id,
  type:w.dataset.type,
  x:w.offsetLeft,
  y:w.offsetTop,
  width:w.offsetWidth,
  height:w.offsetHeight,
  min:w.classList.contains('minimized'),
  data:collect(w)
 }));

 localStorage.setItem(KEY,JSON.stringify(state));
};

function collect(w){

 let d={};

 w.querySelectorAll('[data-k]').forEach(e=>{
  d[e.dataset.k]=e.value;
 });

 return d;
}


/* ---------------- BACKGROUNDS ---------------- */

const backgrounds={

 "Lugna":[

  ["Strand",
   "linear-gradient(135deg,#496f80,#d7c7a1)"],

  ["Skog",
   "linear-gradient(135deg,#193b2b,#789b78,#d8c99d)"],

  ["Himmel",
   "linear-gradient(135deg,#426b86,#a9c9d7,#e8d8bd)"],

  ["Sjö",
   "linear-gradient(135deg,#214d68,#78a9b9,#d7d4bd)"],

  ["Solnedgång",
   "linear-gradient(135deg,#513f52,#b77c63,#e0b67b)"]

 ],

 "Årstider":[

  ["Vår",
   "linear-gradient(135deg,#729b72,#b7d39a,#ead5a0)"],

  ["Sommar",
   "linear-gradient(135deg,#3c7284,#8fc2ba,#e7d19a)"],

  ["Höst",
   "linear-gradient(135deg,#634f3d,#a8794e,#d5bd8b)"],

  ["Vinter",
   "linear-gradient(135deg,#6d8492,#b9cad2,#e8edf0)"],

  ["Jul",
   "linear-gradient(135deg,#315247,#7f9b72,#c7b78a)"]

 ],

 "Enkla":[

  ["Ljus",
   "linear-gradient(135deg,#e7edf1,#ffffff)"],

  ["Sand",
   "linear-gradient(135deg,#d8c6a4,#f1e7d1)"],

  ["Grå",
   "linear-gradient(135deg,#65727c,#b7c0c5)"],

  ["Grön",
   "linear-gradient(135deg,#54735d,#a9c1a5)"],

  ["Blå",
   "linear-gradient(135deg,#52748c,#b4ccd7)"]

 ],

 "Fantasi":[

  ["Rymd",
   "linear-gradient(135deg,#20294e,#59688d,#b38c73)"],

  ["Sagobok",
   "linear-gradient(135deg,#64526d,#b49a76,#d9c8a5)"],

  ["Äventyr",
   "linear-gradient(135deg,#355f68,#8b9f78,#d4b47a)"],

  ["Hav",
   "linear-gradient(135deg,#17485d,#4c8da0,#c3d2c8)"],

  ["Moln",
   "linear-gradient(135deg,#6f8292,#cbd7dc,#f4f1e8)"]

 ]

};


function renderBgMenu(){

 const cats=document.getElementById('bgCategories');
 const grid=document.getElementById('bgGrid');

 cats.innerHTML='';

 Object.keys(backgrounds).forEach((cat,i)=>{

  const b=document.createElement('button');

  b.textContent=cat;

  b.onclick=()=>showBgCategory(cat);

  if(i===0)b.classList.add('active');

  cats.appendChild(b);

 });

 showBgCategory(Object.keys(backgrounds)[0]);

}


function showBgCategory(cat){

 document.querySelectorAll(
  '.bgCategories button'
 ).forEach(
  b=>b.classList.toggle(
   'active',
   b.textContent===cat
  )
 );

 const grid=document.getElementById('bgGrid');

 grid.innerHTML='';

 backgrounds[cat].forEach(([name,bg])=>{

  const b=document.createElement('button');

  b.className='bgChoice';

  b.style.background=bg;

  b.innerHTML=
   '<span class="bgLabel">'+
   name+
   '</span>';

  b.onclick=()=>{

   document.body.style.backgroundImage='none';

   bgVideo.style.display='none';

   bgVideo.pause();

   state.background={
    kind:'css',
    value:bg
   };

   localStorage.setItem(
    KEY,
    JSON.stringify(state)
   );

   document.body.style.background=bg;

   closePanel('backgroundPanel');

  };

  grid.appendChild(b);

 });

}


function closePanel(id){

 document
  .getElementById(id)
  .classList
  .remove('open');

}

renderBgMenu();


/* ---------------- ADD WIDGET ---------------- */

function add(type,s={}){

 const w=document.createElement('section');

 w.className=
  'widget '+
  (type==='note'?'note ':'')+
  (s.min?'minimized':'');

 w.dataset.type=type;

 w.id=
  s.id ||
  ('w'+Date.now()+Math.random());

 const size={

  note:[360,300],

  now:[420,360],

  day:[350,190],

  schedule:[420,520],

  links:[390,300],

  clock:[300,180],

  timer:[320,210],

  image:[480,350]

 }[type]||[350,220];


 w.style.left=
  (s.x??70+Math.random()*180)+'px';

 w.style.top=
  (s.y??50+Math.random()*120)+'px';

 w.style.width=
  (s.width||size[0])+'px';

 w.style.height=
  (s.height||size[1])+'px';


 const d=s.data||{};

 const title={

  note:'📝 Anteckning',

  now:'▶️ NU',

  day:'📅 Dagen',

  schedule:'📋 Schema',

  links:'🔗 Länkar',

  clock:'🕒 Klocka',

  timer:'⌛ Timer',

  image:'🖼️ Bild'

 }[type];


 let c='';


 if(type==='note')

  c=
   '<textarea data-k="text" '+
   'placeholder="Skriv här...">'+
   esc(d.text)+
   '</textarea>';


 if(type==='day')

  c=
   '<div class="today"></div>'+
   '<div class="date"></div>'+
   '<p class="muted">'+
   'Datum och veckodag uppdateras automatiskt.'+
   '</p>';


 if(type==='clock')

  c=
   '<div class="clockText">--:--</div>';


 if(type==='links')

  c=
   '<div class="linksGrid">'+

   [
    ['▶️','UR Play','https://urplay.se/'],
    ['📺','SVT Play','https://www.svtplay.se/'],
    ['🧩','Skolon','https://skolon.com/'],
    ['🎬','SLI','https://sliplay.se/'],
    ['🔴','YouTube','https://www.youtube.com/']

   ].map(x=>

    '<a class="serviceLink" '+
    'href="'+x[2]+'" '+
    'target="_blank" '+
    'rel="noopener noreferrer">'+
    x[0]+' '+x[1]+
    '</a>'

   ).join('')+

   '</div>'+

   '<p class="muted">'+
   'Lägg egna länkar i NU-fönstret för en specifik lektion.'+
   '</p>';


 if(type==='timer')

  c=
   '<div class="timerNum">05:00</div>'+
   '<div class="row">'+
   '<input data-k="minutes" type="number" min="1" value="'+
   esc(d.minutes||5)+
   '">' +
   '<button class="action start">Start</button>'+
   '<button class="action secondary stop">Stopp</button>'+
   '</div>';


 if(type==='image')

  c=
   '<input type="file" accept="image/*" '+
   'onchange="loadImage(this,'+
   JSON.stringify(w.id)+')">'+
   '<img alt="Bild" '+
   'style="max-width:100%;margin-top:10px;border-radius:10px">';


 if(type==='now')

  c=nowBody(d);


 if(type==='schedule')

  c=scheduleBody();


 w.innerHTML=

  '<div class="head">'+

   '<span class="title">'+
   title+
   '</span>'+

   '<button class="mini" title="Minimera">−</button>'+

   '<button class="close" title="Stäng">×</button>'+

  '</div>'+

  '<div class="body">'+
  c+
  '</div>';


 board.appendChild(w);

 wire(w);

 drag(w);

 save();

 return w;

}


/* ---------------- NU-FÖNSTER ---------------- */

function nowBody(d){

 const links=d.links?
  JSON.parse(d.links):
  [];

 return (

  '<div class="nowTitle">'+
  esc(d.subject||'Dagens lektion')+
  '</div>'+

  '<div class="nowActions">'+

   '<button onclick="nowAddLink(this)">'+
   '🔗 Lägg till länk'+
   '</button>'+

   '<button onclick="nowAddLink(this,\'UR Play\')">'+
   '▶️ UR Play'+
   '</button>'+

  '</div>'+

  '<textarea class="nowNote" '+
  'data-k="note" '+
  'placeholder="Skriv instruktioner, uppgifter eller bildstödsord...">'+
  esc(d.note||'')+
  '</textarea>'+

  '<div class="nowLinkList">'+

   links.map(x=>

    '<a class="nowLink" '+
    'href="'+esc(x.url)+'" '+
    'target="_blank" '+
    'rel="noopener noreferrer">'+
    '▶️ '+esc(x.name)+
    '</a>'

   ).join('')+

  '</div>'

 );

}


function nowAddLink(btn,preset){

 const w=btn.closest('.widget');

 let name,url;

 if(preset){

  name=preset;

  url='https://urplay.se/';

 }else{

  name=prompt(
   'Namn på länken, t.ex. "Film om vikingatiden":',
   ''
  );

  if(!name)return;

  url=prompt(
   'Klistra in webbadressen:',
   'https://'
  );

  if(!url)return;

 }

 if(!/^https?:\/\//i.test(url))

  url='https://'+url;


 let links=[];

 try{

  links=JSON.parse(
   w.querySelector(
    '[data-k="links"]'
   )?.value||'[]'
  );

 }catch(e){}


 links.push({
  name,
  url
 });


 let hidden=w.querySelector(
  '[data-k="links"]'
 );


 if(!hidden){

  hidden=document.createElement('input');

  hidden.type='hidden';

  hidden.dataset.k='links';

  w.querySelector('.body')
   .appendChild(hidden);

 }


 hidden.value=
  JSON.stringify(links);


 const a=document.createElement('a');

 a.className='nowLink';

 a.href=url;

 a.target='_blank';

 a.rel='noopener noreferrer';

 a.textContent=
  '▶️ '+name;


 w.querySelector(
  '.nowLinkList'
 ).appendChild(a);


 save();

}


/* ---------------- SCHEMA ---------------- */

function scheduleBody(){

 return (

  '<div class="row">'+

   '<button class="action addRow">'+
   '＋ Rad'+
   '</button>'+

   '<button class="action secondary preview">'+
   'Visa'+
   '</button>'+

  '</div>'+

  '<p class="muted">'+
  'Bygg dagens schema en gång och använd det som stöd på tavlan.'+
  '</p>'+

  '<div class="scheduleRows"></div>'+

  '<div class="schedulePreview"></div>'

 );

}


/* ---------------- WIDGET EVENTS ---------------- */

function wire(w){

 w.querySelector('.close').onclick=()=>{

  w.remove();

  save();

 };


 w.querySelector('.mini').onclick=()=>{

  w.classList.toggle('minimized');

  save();

 };


 w.querySelectorAll('[data-k]')
  .forEach(e=>
   e.addEventListener(
    'input',
    save
   )
  );


 if(w.dataset.type==='day'){

  const f=()=>{

   let n=new Date();

   w.querySelector('.today')
    .textContent=
    n.toLocaleDateString(
     'sv-SE',
     {weekday:'long'}
    );

   w.querySelector('.date')
    .textContent=
    n.toLocaleDateString(
     'sv-SE',
     {
      day:'numeric',
      month:'long',
      year:'numeric'
     }
    );

  };

  f();

  setInterval(f,60000);

 }


 if(w.dataset.type==='clock'){

  const f=()=>

   w.querySelector('.clockText')
    .textContent=
    new Date().toLocaleTimeString(
     'sv-SE',
     {
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit'
     }
    );

  f();

  setInterval(f,1000);

 }


 if(w.dataset.type==='timer'){

  let t=null;

  let left=300;

  const draw=()=>{

   w.querySelector('.timerNum')
    .textContent=
    String(Math.floor(left/60))
     .padStart(2,'0')+
    ':'+
    String(left%60)
     .padStart(2,'0');

  };


  w.querySelector('.start').onclick=()=>{

   clearInterval(t);

   left=
    Math.max(
     1,
     +w.querySelector(
      '[data-k="minutes"]'
     ).value||5
    )*60;

   draw();

   t=setInterval(()=>{

    left--;

    draw();

    if(left<=0){

     clearInterval(t);

     alert('Tiden är slut!');

    }

   },1000);

  };


  w.querySelector('.stop').onclick=()=>

   clearInterval(t);

 }


 if(w.dataset.type==='schedule'){

  const rows=
   w.querySelector('.scheduleRows');

  const preview=
   w.querySelector('.schedulePreview');


  const icons={

   svenska:'🇸🇪',

   sva:'🇸🇪',

   matte:'➗',

   matematik:'➗',

   so:'🌍',

   no:'🔬',

   engelska:'🇬🇧',

   musik:'🎵',

   bild:'🎨',

   idrott:'⚽',

   rast:'🛝',

   lunch:'🍽️',

   slöjd:'🧵'

  };


  const iconFor=t=>{

   let q=t.toLowerCase();

   for(const k in icons)

    if(q.includes(k))

     return icons[k];

   return '📘';

  };


  function row(subject='',time=''){

   let r=
    document.createElement('div');

   r.className='scheduleRow';


   r.innerHTML=

    '<div class="scheduleIcon">'+
    iconFor(subject)+
    '</div>'+

    '<input class="schSubject" '+
    'placeholder="Ämne/aktivitet" '+
    'value="'+esc(subject)+'">'+

    '<input class="schTime" '+
    'placeholder="08:10–09:00" '+
    'value="'+esc(time)+'">'+

    '<button class="del">×</button>';


   r.querySelector('.del').onclick=()=>

    r.remove();


   r.querySelector('.schSubject').oninput=()=>{

    r.querySelector(
     '.scheduleIcon'
    ).textContent=
     iconFor(
      r.querySelector(
       '.schSubject'
      ).value
     );

   };


   rows.appendChild(r);

  }


  function makePreview(){

   preview.innerHTML=

    [...rows.children]
     .map(r=>

      '<div class="scheduleCard">'+

       '<div class="pic">'+
       r.querySelector(
        '.scheduleIcon'
       ).textContent+
       '</div>'+

       '<div class="subject">'+
       esc(
        r.querySelector(
         '.schSubject'
        ).value||
        'Aktivitet'
       )+
       '</div>'+

       '<div class="time">'+
       esc(
        r.querySelector(
         '.schTime'
        ).value
       )+
       '</div>'+

      '</div>'

     ).join('');

  }


  w.querySelector('.addRow').onclick=()=>row();

  w.querySelector('.preview').onclick=
   makePreview;


  row(
   'Svenska',
   '08:10–09:00'
  );

  row(
   'Rast',
   '09:00–09:20'
  );

  row(
   'Matematik',
   '09:20–10:10'
  );

  row(
   'Lunch',
   '11:20–12:00'
  );

 }

}


/* ---------------- DRAG ---------------- */

function drag(w){

 const h=w.querySelector('.head');

 let on=false;

 let sx,sy,ox,oy;


 h.onpointerdown=e=>{

  if(e.target.closest('button'))
   return;

  on=true;

  sx=e.clientX;
  sy=e.clientY;

  ox=w.offsetLeft;
  oy=w.offsetTop;

  h.setPointerCapture(
   e.pointerId
  );

 };


 h.onpointermove=e=>{

  if(on){

   w.style.left=
    Math.max(
     0,
     ox+e.clientX-sx
    )+'px';

   w.style.top=
    Math.max(
     0,
     oy+e.clientY-sy
    )+'px';

  }

 };


 h.onpointerup=()=>{

  on=false;

  save();

 };


 new ResizeObserver(save)
  .observe(w);

}


/* ---------------- BILD ---------------- */

function loadImage(input,id){

 const f=input.files[0];

 if(!f)return;

 const w=
  document.getElementById(id);

 const img=
  w.querySelector('img');

 img.src=
  URL.createObjectURL(f);

 input.value='';

 save();

}


document.getElementById(
 'imageFile'
).onchange=e=>{

 const f=e.target.files[0];

 if(!f)return;

 const w=add('image');

 w.querySelector('img').src=
  URL.createObjectURL(f);

 e.target.value='';

};


/* ---------------- FULLSKÄRM ---------------- */

function fullscreen(){

 document.documentElement
  .requestFullscreen?.();

}


/* ---------------- SPARAD BAKGRUND ---------------- */

function applySavedBg(){

 if(!state.background)
  return;

 if(
  state.background.kind==='css'
 ){

  document.body.style.background=
   state.background.value;

 }

}

applySavedBg();


/* ---------------- ÅTERSTÄLL WIDGETS ---------------- */

if(state.widgets?.length){

 state.widgets.forEach(
  x=>add(x.type,x)
 );

}else{

 add('day');

 add('schedule');

 add('clock');

}
