<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassrumstavlan</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;color:#17212b;overflow:hidden}
body{background:#dbeafe center/cover no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(239,246,255,.78),rgba(255,255,255,.35));pointer-events:none}
.top{position:fixed;z-index:1000;left:18px;right:18px;top:14px;height:70px;background:rgba(255,255,255,.93);border-radius:22px;box-shadow:0 8px 30px #0002;display:flex;align-items:center;padding:10px 14px;gap:10px}
.brand{font-size:21px;font-weight:800;margin-right:6px}.quick{display:flex;gap:7px;overflow:auto;flex:1}
.quick a,.top button,.upload{border:0;text-decoration:none;color:#17212b;background:#eef2f7;border-radius:13px;padding:11px 13px;font-weight:700;cursor:pointer;white-space:nowrap}
.quick a:hover,.top button:hover,.upload:hover{background:#dbeafe}
.clock{font-size:24px;font-weight:800;min-width:105px;text-align:center}
#board{position:fixed;inset:96px 0 76px}
.bottom{position:fixed;z-index:1000;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,.94);padding:9px;border-radius:18px;box-shadow:0 8px 30px #0002}
.bottom button,.bottom label{border:0;background:#eef2f7;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.widget{position:absolute;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 12px 32px #0003;min-width:240px;min-height:130px;overflow:hidden;resize:both;border:1px solid #fff}
.head{height:43px;padding:11px 13px;background:#f8fafc;font-weight:800;cursor:move;display:flex;justify-content:space-between}.close{border:0;background:none;font-size:20px;cursor:pointer}
.body{padding:14px;height:calc(100% - 43px);overflow:auto}
.postit{background:#fff4a8}.postit .head{background:#ffe97a}.postit textarea{background:transparent;border:0;resize:none;font:600 20px/1.45 "Comic Sans MS",Arial,sans-serif;min-height:100%;height:100%;outline:none}
textarea,input{width:100%;border:1px solid #ccd5df;border-radius:10px;padding:10px;margin:4px 0 9px;font-size:15px}
button.action{border:0;background:#2563eb;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700}
.imageWidget img{width:100%;height:100%;object-fit:contain;display:block}
.aiBox textarea{height:90px}.aiOut{white-space:pre-wrap;background:#f4f7fb;border-radius:12px;padding:10px;min-height:70px}
.day{font-size:28px;font-weight:800;text-transform:capitalize}.sub{opacity:.65;margin-top:6px}
@media(max-width:850px){.brand{display:none}.top{left:8px;right:8px}.clock{font-size:18px;min-width:80px}.bottom{max-width:96vw;overflow:auto}}
</style>
</head><body>
<header class="top"><div class="brand">🎓 Klassrumstavlan</div>
<nav class="quick">
<a href="https://skolon.com/sv/hem/" target="_blank" rel="noopener">🧩 Skolon</a>
<a href="https://urplay.se/" target="_blank" rel="noopener">▶️ UR Play</a>
<a href="https://www.svtplay.se/" target="_blank" rel="noopener">📺 SVT Play</a>
<a href="https://sli.se/" target="_blank" rel="noopener">🎬 SLI</a>
<a href="https://www.youtube.com/" target="_blank" rel="noopener">🔴 YouTube</a>
</nav><div id="clock" class="clock"></div></header>
<main id="board"></main>
<footer class="bottom">
<button data-add="day">📅 Dagen</button><button data-add="note">🟨 Post-it</button>
<button data-add="ai">✨ AI-hjälp</button><label>🖼️ Bild<input id="imgFile" type="file" accept="image/*" hidden></label>
<label>🏞️ Bakgrund<input id="bgFile" type="file" accept="image/*" hidden></label>
<button id="reset">↺ Återställ</button>
</footer>
<script>
const board=document.querySelector('#board'),KEY='klassrumstavlan-v3';
let state=JSON.parse(localStorage.getItem(KEY)||'{"widgets":[]}');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);
function save(){state.widgets=[...document.querySelectorAll('.widget')].map(w=>({id:w.id,type:w.dataset.type,x:w.offsetLeft,y:w.offsetTop,width:w.offsetWidth,height:w.offsetHeight,data:collect(w)}));state.bg=document.body.style.backgroundImage;localStorage.setItem(KEY,JSON.stringify(state))}
function collect(w){let d={};w.querySelectorAll('[data-k]').forEach(e=>d[e.dataset.k]=e.value);if(w.dataset.type==='image')d.src=w.querySelector('img')?.src||'';return d}
function add(type,s={}){
 let w=document.createElement('section');w.id=s.id||'w'+Date.now()+Math.random();w.dataset.type=type;w.className='widget '+(type==='note'?'postit ':'')+(type==='image'?'imageWidget ':'')+(type==='ai'?'aiBox ':'');
 w.style.left=(s.x??40+Math.random()*200)+'px';w.style.top=(s.y??30+Math.random()*130)+'px';w.style.width=(s.width||(type==='note'?360:type==='ai'?430:360))+'px';w.style.height=(s.height||(type==='note'?300:type==='image'?320:230))+'px';
 let d=s.data||{}, title={day:'Dagen',note:'Anteckning',ai:'AI-hjälp',image:'Bild'}[type];
 let c='';
 if(type==='day')c='<div class="day"></div><div class="sub">Ha en fin skoldag!</div>';
 if(type==='note')c=`<textarea data-k="text" placeholder="Skriv din anteckning här...">${esc(d.text)}</textarea>`;
 if(type==='image')c=`<img src="${d.src||''}" alt="Infogad bild">`;
 if(type==='ai')c=`<div class="sub">Skriv en fråga. Knappen öppnar ChatGPT med din fråga färdig att klistra in. En riktig AI direkt inuti GitHub Pages kräver en säker server/API-anslutning.</div><textarea data-k="prompt" placeholder="T.ex. Förklara fotosyntesen för årskurs 4...">${esc(d.prompt)}</textarea><button class="action askAI">Öppna ChatGPT</button><div class="aiOut">Tips: kopiera frågan automatiskt med knappen.</div>`;
 w.innerHTML=`<div class="head"><span>${title}</span><button class="close">×</button></div><div class="body">${c}</div>`;board.appendChild(w);wire(w);drag(w);save();return w
}
function wire(w){
 w.querySelector('.close').onclick=()=>{w.remove();save()};
 w.querySelectorAll('textarea,input').forEach(e=>e.addEventListener('input',save));
 if(w.dataset.type==='day'){let e=w.querySelector('.day'),f=()=>e.textContent=new Date().toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});f();setInterval(f,60000)}
 if(w.dataset.type==='ai')w.querySelector('.askAI').onclick=async()=>{let p=w.querySelector('[data-k=prompt]').value.trim();if(!p)return;try{await navigator.clipboard.writeText(p);w.querySelector('.aiOut').textContent='Frågan är kopierad. Klistra in den i ChatGPT.'}catch{}window.open('https://chatgpt.com/','_blank','noopener')};
}
function drag(w){let h=w.querySelector('.head'),on=0,sx=0,sy=0,ox=0,oy=0;h.onpointerdown=e=>{if(e.target.closest('button'))return;on=1;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(on){w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'}};h.onpointerup=()=>{on=0;save()};new ResizeObserver(save).observe(w)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.querySelector('#imgFile').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>add('image',{data:{src:r.result}});r.readAsDataURL(f);e.target.value=''};
document.querySelector('#bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>{document.body.style.backgroundImage=`url("${r.result}")`;save()};r.readAsDataURL(f);e.target.value=''};
document.querySelector('#reset').onclick=()=>{if(confirm('Återställa tavlan?')){localStorage.removeItem(KEY);location.reload()}};
if(state.bg)document.body.style.backgroundImage=state.bg;
if(state.widgets?.length)state.widgets.forEach(s=>add(s.type,s));else{add('day',{x:35,y:30,width:390,height:180});add('note',{x:450,y:30,width:390,height:300})}
</script></body></html>
