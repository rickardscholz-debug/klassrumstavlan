<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klassrumstavlan</title>
<style>
:root{--glass:rgba(20,28,36,.72);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:white;overflow:hidden}
body{background:#274b5d center/cover no-repeat;transition:background-image .4s}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.3));pointer-events:none}
#board{position:fixed;inset:0 0 74px 0}
.widget{position:absolute;min-width:220px;min-height:120px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.28);overflow:hidden;resize:both}
.widget .head{padding:10px 12px;background:rgba(0,0,0,.2);cursor:move;display:flex;align-items:center;justify-content:space-between;font-weight:700}
.widget .body{padding:14px;height:calc(100% - 42px);overflow:auto}
.close{border:0;background:transparent;color:white;font-size:18px;cursor:pointer}
.toolbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;max-width:96vw;padding:8px 10px;background:rgba(16,20,25,.8);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;z-index:1000;overflow-x:auto}
.toolbar button,.toolbar label{border:0;border-radius:12px;background:rgba(255,255,255,.13);color:white;padding:10px 12px;cursor:pointer;white-space:nowrap;font-size:14px}
.toolbar button:hover,.toolbar label:hover{background:rgba(255,255,255,.23)}
input,textarea,select{width:100%;padding:9px;border-radius:9px;border:1px solid #aaa;margin:5px 0 9px}
textarea{min-height:90px}
.bigtime{font-size:52px;font-weight:700;text-align:center}
.date{font-size:28px;text-align:center;margin-top:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.timer{font-size:48px;text-align:center;font-weight:700}
.light{width:72px;height:72px;border-radius:50%;margin:8px auto;opacity:.28}.light.active{opacity:1;box-shadow:0 0 25px currentColor}
.red{background:#ef4444}.yellow{background:#facc15}.green{background:#22c55e}
.linkcard{display:block;color:white;text-decoration:none;background:rgba(255,255,255,.12);padding:10px;border-radius:10px;margin:7px 0}
.schedule td,.schedule th{padding:6px;border-bottom:1px solid rgba(255,255,255,.18);text-align:left}
.schedule{width:100%;border-collapse:collapse}
.hint{font-size:12px;opacity:.75}
@media(max-width:700px){.toolbar{left:8px;right:8px;transform:none}.widget{max-width:94vw}}
</style>
</head>
<body>
<div id="board"></div>
<div class="toolbar">
<button data-add="day">📅 Dagen</button>
<button data-add="clock">🕒 Klocka</button>
<button data-add="timer">⏱ Timer</button>
<button data-add="text">📝 Text</button>
<button data-add="traffic">🚦 Ljus</button>
<button data-add="random">🎲 Slumpa</button>
<button data-add="links">🔗 Länkar</button>
<button data-add="schedule">📚 Schema</button>
<button id="bgBtn">🏞 Bakgrund</button>
<label>📷 Egen bild<input id="bgFile" type="file" accept="image/*" hidden></label>
<button id="clearBtn">↺ Återställ</button>
</div>

<script>
const board=document.getElementById('board');
const KEY='klassrumstavlan-v2-fixed';
let state=JSON.parse(localStorage.getItem(KEY)||'{"widgets":[]}');
const backgrounds=[
'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=90',
'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=90',
'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2000&q=90',
'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=90'
];
let bgIndex=0;
function save(){
 state.widgets=[...document.querySelectorAll('.widget')].map(w=>({id:w.id,type:w.dataset.type,x:w.offsetLeft,y:w.offsetTop,width:w.offsetWidth,height:w.offsetHeight,data:collect(w)}));
 state.bg=document.body.style.backgroundImage;
 localStorage.setItem(KEY,JSON.stringify(state));
}
function collect(w){
 let o={}; w.querySelectorAll('[data-k]').forEach(el=>o[el.dataset.k]=el.value);
 if(w.dataset.type==='traffic') o.active=w.dataset.active||'green';
 return o;
}
function title(type){return({day:'Dagen',clock:'Klocka',timer:'Timer',text:'Anteckningar',traffic:'Trafikljus',random:'Slumpa elev',links:'Mina länkar',schedule:'Veckoschema'})[type]||type}
function content(type,d={}){
 if(type==='day')return `<div class="date" id="dayText"></div><div style="text-align:center;font-size:64px">☀️</div><input data-k="note" placeholder="Dagens information" value="${esc(d.note||'')}">`;
 if(type==='clock')return `<div class="bigtime" id="clockText">--:--</div>`;
 if(type==='timer')return `<div class="timer" id="timerText">05:00</div><div class="row"><input data-k="minutes" type="number" min="1" value="${esc(d.minutes||5)}"><button class="timerStart">Start</button><button class="timerStop">Stopp</button></div>`;
 if(type==='text')return `<textarea data-k="text" placeholder="Skriv här...">${esc(d.text||'')}</textarea>`;
 if(type==='traffic')return `<div class="light red" data-light="red"></div><div class="light yellow" data-light="yellow"></div><div class="light green active" data-light="green"></div><div class="hint">Klicka på en färg.</div>`;
 if(type==='random')return `<textarea data-k="names" placeholder="Skriv ett namn per rad">${esc(d.names||'')}</textarea><button class="pick">Slumpa</button><h2 class="picked" style="text-align:center"></h2>`;
 if(type==='links')return `<input data-k="label" placeholder="Namn, t.ex. UR Play" value="${esc(d.label||'')}"><input data-k="url" placeholder="https://..." value="${esc(d.url||'')}"><button class="openLink">Öppna länken</button><div class="hint">Länken öppnas i en ny flik.</div>`;
 if(type==='schedule')return `<textarea data-k="schedule" placeholder="08:10 Svenska&#10;09:00 Matematik&#10;10:10 Rast">${esc(d.schedule||'')}</textarea><button class="showSchedule">Visa schema</button><div class="scheduleOut"></div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function add(type, saved){
 const w=document.createElement('section'); w.className='widget'; w.dataset.type=type; w.id=saved?.id||('w'+Date.now()+Math.random().toString(16).slice(2));
 w.style.left=(saved?.x??(40+Math.random()*180))+'px';w.style.top=(saved?.y??(40+Math.random()*120))+'px';
 w.style.width=(saved?.width||320)+'px';w.style.height=(saved?.height||220)+'px';
 w.innerHTML=`<div class="head"><span>${title(type)}</span><button class="close">×</button></div><div class="body">${content(type,saved?.data||{})}</div>`;
 board.appendChild(w); wire(w); makeDrag(w);
 if(type==='traffic'&&saved?.data?.active)setLight(w,saved.data.active);
 if(type==='schedule')renderSchedule(w);
 save(); return w;
}
function wire(w){
 w.querySelector('.close').onclick=()=>{w.remove();save()};
 w.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('change',save));
 if(w.dataset.type==='day')updateDay(w);
 if(w.dataset.type==='clock')updateClock(w);
 if(w.dataset.type==='timer'){
  let t=null,left=0; const out=w.querySelector('#timerText');
  const draw=()=>{out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
  w.querySelector('.timerStart').onclick=()=>{clearInterval(t);left=Math.max(1,parseInt(w.querySelector('[data-k=minutes]').value)||5)*60;draw();t=setInterval(()=>{left--;draw();if(left<=0){clearInterval(t);alert('Tiden är slut!')}},1000)};
  w.querySelector('.timerStop').onclick=()=>clearInterval(t);
 }
 if(w.dataset.type==='traffic')w.querySelectorAll('[data-light]').forEach(l=>l.onclick=()=>{setLight(w,l.dataset.light);save()});
 if(w.dataset.type==='random')w.querySelector('.pick').onclick=()=>{const a=w.querySelector('[data-k=names]').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);w.querySelector('.picked').textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Lägg in namn först'};
 if(w.dataset.type==='links')w.querySelector('.openLink').onclick=()=>{let u=w.querySelector('[data-k=url]').value.trim();if(!u)return; if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener')};
 if(w.dataset.type==='schedule')w.querySelector('.showSchedule').onclick=()=>{renderSchedule(w);save()};
}
function setLight(w,c){w.dataset.active=c;w.querySelectorAll('[data-light]').forEach(x=>x.classList.toggle('active',x.dataset.light===c))}
function renderSchedule(w){const out=w.querySelector('.scheduleOut'),ta=w.querySelector('[data-k=schedule]');if(!out||!ta)return;let rows=ta.value.split('\n').filter(Boolean).map(x=>{let p=x.trim().split(/\s+/,2);return `<tr><td>${esc(p[0]||'')}</td><td>${esc(x.trim().slice((p[0]||'').length).trim())}</td></tr>`}).join('');out.innerHTML=rows?`<table class="schedule"><tbody>${rows}</tbody></table>`:''}
function updateDay(w){const e=w.querySelector('#dayText');const tick=()=>{const d=new Date();e.textContent=d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};tick();setInterval(tick,60000)}
function updateClock(w){const e=w.querySelector('#clockText');const tick=()=>e.textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});tick();setInterval(tick,1000)}
function makeDrag(w){
 const h=w.querySelector('.head');let sx,sy,ox,oy,drag=false;
 h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;h.setPointerCapture(e.pointerId)});
 h.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'});
 h.addEventListener('pointerup',()=>{drag=false;save()});
 new ResizeObserver(()=>save()).observe(w);
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.getElementById('bgBtn').onclick=()=>{bgIndex=(bgIndex+1)%backgrounds.length;document.body.style.backgroundImage=`url("${backgrounds[bgIndex]}")`;save()};
document.getElementById('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.body.style.backgroundImage=`url("${r.result}")`;save()};r.readAsDataURL(f)};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Återställa tavlan?')){localStorage.removeItem(KEY);location.reload()}};
if(state.bg)document.body.style.backgroundImage=state.bg; else document.body.style.backgroundImage=`url("${backgrounds[0]}")`;
if(state.widgets?.length)state.widgets.forEach(x=>add(x.type,x)); else {add('day',{x:40,y:40,width:390,height:230,data:{}});add('clock',{x:460,y:40,width:300,height:180,data:{}})}
window.addEventListener('beforeunload',save);
</script>
</body>
</html>
