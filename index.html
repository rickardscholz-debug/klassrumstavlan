<style>

const extraNatureBackgrounds=[[["Skogsstig","https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2200&q=85"],["Grön skog","https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=2200&q=85"],["Mossig skog","https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=85"],["Trädtoppar","https://images.unsplash.com/photo-1458966480358-a0ac42de0a7a?auto=format&fit=crop&w=2200&q=85"],["Skogsljus","https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2200&q=85"],["Skogsväg","https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=2200&q=85"],["Ormbunkar","https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=2200&q=85"],["Skogsdimma","https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2200&q=85"],["Grön allé","https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2200&q=85"],["Bladverk","https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=2200&q=85"],["Djungel","https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=2200&q=85"],["Grön natur","https://images.unsplash.com/photo-1482938289607-e9573fc25ebb?auto=format&fit=crop&w=2200&q=85"],["Stora träd","https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=2200&q=85"]],[["Bergsvy","https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=85"],["Fjällandskap","https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=85"],["Bergskedja","https://images.unsplash.com/photo-1454496522488-7a8e488e860e?auto=format&fit=crop&w=2200&q=85"],["Alperna","https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?auto=format&fit=crop&w=2200&q=85"],["Bergsdal","https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2200&q=85"],["Berg och sjö","https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2200&q=85"],["Höga berg","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=2200&q=85"],["Snöklädda toppar","https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=2200&q=85"],["Fjällsjö","https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=2200&q=85"],["Vandringsled","https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=2200&q=85"],["Bergsskog","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=85"],["Klippig natur","https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=2200&q=85"],["Bergslandskap","https://images.unsplash.com/photo-1458668383970-8ddd3927deed?auto=format&fit=crop&w=2200&q=85"]],[["Still sjö","https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=2200&q=85"],["Vattenfall","https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?auto=format&fit=crop&w=2200&q=85"],["Havskust","https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=2200&q=85"],["Klarblått vatten","https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2200&q=85"],["Vattenyta","https://images.unsplash.com/photo-1497436072909-60f362e1d4b1?auto=format&fit=crop&w=2200&q=85"],["Bergssjö","https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8?auto=format&fit=crop&w=2200&q=85"],["Stenig kust","https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=2200&q=85"],["Sjö i dal","https://images.unsplash.com/photo-1439853949212-09789ba454a8?auto=format&fit=crop&w=2200&q=85"],["Vågor","https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=2200&q=85"],["Sandstrand","https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=2200&q=85"],["Vatten och skog","https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=2200&q=85"],["Flodlandskap","https://images.unsplash.com/photo-1511300636408-a63a89df3482?auto=format&fit=crop&w=2200&q=85"]],[["Vårgrönska","https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=2200&q=85"],["Sommaräng","https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2200&q=85"],["Höstskog","https://images.unsplash.com/photo-1439405326854-014607f694d7?auto=format&fit=crop&w=2200&q=85"],["Vinterlandskap","https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=2200&q=85"],["Snöig skog","https://images.unsplash.com/photo-1418985991508-e47386d96a71?auto=format&fit=crop&w=2200&q=85"],["Gräslandskap","https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=2200&q=85"],["Blomsterfält","https://images.unsplash.com/photo-1499002238440-d264edd596ec?auto=format&fit=crop&w=2200&q=85"],["Landsbygd","https://images.unsplash.com/photo-1476067897447-d0c5df27b5df?auto=format&fit=crop&w=2200&q=85"],["Grön äng","https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2200&q=85"],["Frostiga träd","https://images.unsplash.com/photo-1457269449834-928af64c684d?auto=format&fit=crop&w=2200&q=85"],["Dimma över land","https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&w=2200&q=85"],["Lummigt landskap","https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=2200&q=85"]]];
const calmBackgrounds=['linear-gradient(135deg,#eef3f7,#d9e3ec)','linear-gradient(135deg,#f4f0e8,#e7e0d2)','linear-gradient(135deg,#edf4ef,#dce9df)','linear-gradient(135deg,#f2f3f5,#dfe2e7)'];
const seasonBackgrounds=[
  'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=90',
  'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=2200&q=90',
  'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2200&q=90',
  'https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=2200&q=90'
];

function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));return s&&s.windows?s:{windows:{},backgrounds:{type:'gradient',value:calmBackgrounds[0]}}}catch(e){return{windows:{},backgrounds:{type:'gradient',value:calmBackgrounds[0]}}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function uid(type){return type+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function normalizeUrl(url){url=String(url||'').trim();if(!url)return '';if(!/^https?:\/\//i.test(url))url='https://'+url;try{return new URL(url).href}catch(e){return ''}}
function createWindow(type,title,icon,opts={}){
  const id=opts.id||uid(type);const w=document.createElement('section');w.className='window';w.dataset.id=id;w.dataset.type=type;w.style.left=(opts.left??(80+(Object.keys(state.windows).length*28)%360))+'px';w.style.top=(opts.top??(70+(Object.keys(state.windows).length*24)%260))+'px';w.style.width=(opts.width??460)+'px';w.style.height=(opts.height??380)+'px';w.style.zIndex=++zCounter;
  w.innerHTML=`<div class="windowHeader"><div class="windowTitle"><span class="windowTitleIcon">${icon}</span><span>${title}</span></div><div class="windowButtons"><button class="windowButton minBtn" title="Minimera">−</button><button class="windowButton closeBtn" title="Stäng">×</button></div></div><div class="windowBody"></div>`;
  document.getElementById('desktop').appendChild(w);setupWindow(w);state.windows[id]={type,data:{}};saveState();return w;
}
function setupWindow(w){
  const header=w.querySelector('.windowHeader');w.addEventListener('mousedown',()=>bringToFront(w));
  w.querySelector('.minBtn').onclick=e=>{e.stopPropagation();w.classList.toggle('minimized');saveWindowState(w)};
  w.querySelector('.closeBtn').onclick=e=>{e.stopPropagation();delete state.windows[w.dataset.id];w.remove();saveState()};
  let sx=0,sy=0,ox=0,oy=0,drag=false;
  header.addEventListener('mousedown',e=>{if(e.target.closest('.windowButton'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bringToFront(w);document.body.style.userSelect='none';});
  document.addEventListener('mousemove',e=>{if(!drag)return;w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px';});
  document.addEventListener('mouseup',()=>{if(drag){drag=false;document.body.style.userSelect='';saveWindowState(w)}});
  new ResizeObserver(()=>saveWindowState(w)).observe(w);
}
function bringToFront(w){w.style.zIndex=++zCounter}
function saveWindowState(w){const s=state.windows[w.dataset.id];if(!s)return;s.minimized=w.classList.contains('minimized');s.left=w.offsetLeft;s.top=w.offsetTop;s.width=w.offsetWidth;s.height=w.offsetHeight;saveState()}
function setWindowData(w,data){state.windows[w.dataset.id].data=data;saveWindowState(w)}

function editorToolbar(editor,onSave){
  const bar=document.createElement('div');bar.className='editToolbar';
  const b=document.createElement('button');b.className='editButton';b.innerHTML='<b>B</b>';b.onclick=()=>{editor.focus();document.execCommand('bold');onSave?.()};
  const i=document.createElement('button');i.className='editButton';i.innerHTML='<i>I</i>';i.onclick=()=>{editor.focus();document.execCommand('italic');onSave?.()};
  const img=document.createElement('button');img.className='editButton';img.textContent='📷 Bild';img.onclick=()=>{const u=prompt('Klistra in bildens webbadress (URL):');if(u){editor.focus();document.execCommand('insertImage',false,normalizeUrl(u));onSave?.()}};
  const link=document.createElement('button');link.className='editButton';link.textContent='🔗 Länk';link.onclick=()=>addLink(editor,onSave);
  bar.append(b,i,img,link);return bar;
}
function addLink(editor,onSave){
  // Spara markeringen innan prompt-fönstren tar fokus.
  const selection=window.getSelection();
  let range=null;
  let selectedText='';
  if(selection && selection.rangeCount){
    const r=selection.getRangeAt(0);
    if(editor.contains(r.commonAncestorContainer)){
      range=r.cloneRange();
      selectedText=selection.toString().trim();
    }
  }

  const text=prompt('Text som ska visas för länken:',selectedText||'Öppna länk');
  if(!text)return;
  const rawUrl=prompt('Webbadress (URL):','https://');
  const url=normalizeUrl(rawUrl);
  if(!url){alert('Fyll i en giltig webbadress, till exempel https://www.svtplay.se/');return}

  editor.focus();
  const sel=window.getSelection();
  if(range){sel.removeAllRanges();sel.addRange(range)}

  const a=document.createElement('a');
  a.href=url;
  a.target='_blank';
  a.rel='noopener noreferrer';
  a.textContent=text;
  a.title=url;

  if(sel && sel.rangeCount && editor.contains(sel.getRangeAt(0).commonAncestorContainer)){
    const r=sel.getRangeAt(0);
    r.deleteContents();
    r.insertNode(a);
    r.setStartAfter(a);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }else{
    editor.appendChild(a);
  }
  onSave?.();
}

function setupLessonLinks(editor){
  // Enkelt klick öppnar länken även inuti den redigerbara lektionsytan.
  // Alt+klick används när man vill ändra texten istället.
  editor.addEventListener('click',e=>{
    const a=e.target.closest('a[href]');
    if(!a || !editor.contains(a) || e.altKey)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    window.open(a.href,'_blank');
  },true);
}
function createLesson(data=null,restore=false,opts={}){
  const w=createWindow('lesson','Lektion','📚',{...opts});const body=w.querySelector('.windowBody');
  body.innerHTML=`<input class="lessonHeading" placeholder="Lektionens rubrik" value="${esc(data?.heading||'Ny lektion')}"><input class="lessonDate" placeholder="Datum eller planering (valfritt)" value="${esc(data?.date||'')}"><div class="toolbarHost"></div><div class="editor" contenteditable="true"></div>`;
  const editor=body.querySelector('.editor');editor.innerHTML=data?.html||'<p><strong>Planering</strong></p><p>Skriv instruktioner, text och länkar som eleverna behöver.</p>';
  const heading=body.querySelector('.lessonHeading'),date=body.querySelector('.lessonDate');const save=()=>setWindowData(w,{heading:heading.value,date:date.value,html:editor.innerHTML});body.querySelector('.toolbarHost').appendChild(editorToolbar(editor,save));setupLessonLinks(editor);heading.oninput=save;date.oninput=save;editor.oninput=save;save();
  if(!restore){w.style.left=(100+(lessonCounter++%5)*35)+'px';w.style.top=(90+(lessonCounter%5)*30)+'px';saveWindowState(w)}
  return w;
}
function createNote(data=null,opts={}){const w=createWindow('note','Anteckning','📝',{...opts});const b=w.querySelector('.windowBody');b.innerHTML=`<input class="noteTitle" placeholder="Rubrik" value="${esc(data?.title||'Anteckning')}"><div class="editor" contenteditable="true"></div>`;const e=b.querySelector('.editor');e.innerHTML=data?.html||'';const t=b.querySelector('.noteTitle');const save=()=>setWindowData(w,{title:t.value,html:e.innerHTML});t.oninput=save;e.oninput=save;save();return w}
function createSchedule(data=null,opts={}){const w=createWindow('schedule','Schema','📋',{width:430,height:430,...opts});const b=w.querySelector('.windowBody');const rows=data?.rows||[['08.40','SO','📚'],['09.25','Svenska','📖'],['09.40','Matte','➗'],['10.25','Musik','🎵'],['10.35','SO','📚'],['11.20','Lunch','🍎'],['13.00','Bild','🎨'],['13.45','Musik','🎵']];b.innerHTML='<table class="scheduleTable"><thead><tr><th>Tid</th><th>Ämne</th><th>Bildstöd</th></tr></thead><tbody></tbody></table><button class="smallButton scheduleAdd">＋ Lägg till rad</button>';const tb=b.querySelector('tbody');function render(){tb.innerHTML='';rows.forEach((r,idx)=>{const tr=document.createElement('tr');tr.innerHTML=`<td><input value="${esc(r[0])}"></td><td><input value="${esc(r[1])}"></td><td><input value="${esc(r[2])}"></td>`;tr.querySelectorAll('input').forEach((inp,i)=>inp.oninput=()=>{r[i]=inp.value;setWindowData(w,{rows})});tb.appendChild(tr)})}b.querySelector('.scheduleAdd').onclick=()=>{rows.push(['','Ny lektion','📚']);render();setWindowData(w,{rows})};render();setWindowData(w,{rows});return w}
function getDefaultLinks(){return[{name:'UR Play',url:'https://urplay.se/',icon:'🎬'},{name:'SVT Play',url:'https://www.svtplay.se/',icon:'📺'},{name:'YouTube',url:'https://www.youtube.com/',icon:'▶️'},{name:'Skolon',url:'https://www.skolon.com/',icon:'🏫'},{name:'SLI',url:'https://sli.se/',icon:'📚'},{name:'Pinterest',url:'https://se.pinterest.com/rickardscholz/',icon:'📌'}]}
function createLinks(data=null,opts={}){const w=createWindow('links','Länkar','🔗',{width:520,height:420,...opts});const b=w.querySelector('.windowBody');b.innerHTML='<div class="linkForm"><input class="linkName" placeholder="Namn på länken"><input class="linkUrl" placeholder="https://..."><button class="smallButton">＋ Lägg till</button></div><div class="linkList"></div>';let links=(data?.links||getDefaultLinks()).map(x=>({...x}));if(!links.some(x=>x.url?.replace(/\/$/,'')==='https://se.pinterest.com/rickardscholz'))links.push({name:'Pinterest',url:'https://se.pinterest.com/rickardscholz/',icon:'📌'});const list=b.querySelector('.linkList');const save=()=>setWindowData(w,{links});function render(){list.innerHTML='';links.forEach((l,idx)=>{const item=document.createElement('div');item.className='linkItem';const a=document.createElement('a');a.className='linkText';a.href=normalizeUrl(l.url);a.target='_blank';a.rel='noopener noreferrer';a.textContent=(l.icon||'🔗')+' '+l.name;const del=document.createElement('button');del.className='linkDelete';del.textContent='×';del.onclick=()=>{links.splice(idx,1);render();save()};item.append(a,del);list.appendChild(item)})}const add=b.querySelector('.linkForm button');add.onclick=()=>{const n=b.querySelector('.linkName').value.trim(),u=normalizeUrl(b.querySelector('.linkUrl').value);if(!n||!u){alert('Fyll i namn och en giltig webbadress.');return}links.push({name:n,url:u,icon:'🔗'});b.querySelector('.linkName').value='';b.querySelector('.linkUrl').value='';render();save()};render();save();return w}
function createClock(opts={}){const w=createWindow('clock','Klocka','🕒',{width:340,height:230,...opts});w.querySelector('.windowBody').innerHTML='<div class="clock"><div class="clockTime"></div><div class="clockDate"></div></div>';const time=w.querySelector('.clockTime'),date=w.querySelector('.clockDate');const tick=()=>{const n=new Date();time.textContent=n.toLocaleTimeString('sv-SE');date.textContent=n.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})};tick();const timer=setInterval(()=>{if(!document.body.contains(w)){clearInterval(timer);return}tick()},1000);return w}
function createTimer(data=null,opts={}){const w=createWindow('timer','Timer','⏳',{width:390,height:390,...opts});w.querySelector('.windowBody').innerHTML='<div class="timer"><div class="timerDisplay">20:00</div><div class="timerAdjusters"><button data-a="-300">−5 min</button><button data-a="-60">−1 min</button><button data-a="60">+1 min</button><button data-a="300">+5 min</button></div><div class="timerPresets"><button data-p="10">10 min</button><button data-p="15">15 min</button><button data-p="20">20 min</button><button data-p="30">30 min</button><button data-p="40">40 min</button><button data-p="50">50 min</button></div><div class="timerCustom"><input type="number" min="1" max="180" placeholder="Minuter"><button data-set>Ställ in</button></div><div class="timerControls"><button data-start>▶ Start</button><button data-reset>↺ Återställ</button></div></div>';let seconds=Number(data?.seconds??1200),running=false,interval=null;const display=w.querySelector('.timerDisplay'),start=w.querySelector('[data-start]');const render=()=>{const s=Math.max(0,seconds),m=Math.floor(s/60),sec=s%60;display.textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};const persist=()=>setWindowData(w,{seconds});const stop=()=>{clearInterval(interval);interval=null;running=false;start.textContent='▶ Start'};w.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{seconds=Math.max(0,seconds+Number(btn.dataset.a));render();persist()});w.querySelectorAll('[data-p]').forEach(btn=>btn.onclick=()=>{seconds=Number(btn.dataset.p)*60;stop();render();persist()});w.querySelector('[data-set]').onclick=()=>{const v=Number(w.querySelector('input').value);if(v>0){seconds=Math.round(v*60);stop();render();persist();w.querySelector('input').value=''}};start.onclick=()=>{if(running){stop();return}if(seconds<=0)return;running=true;start.textContent='Ⅱ Paus';interval=setInterval(()=>{seconds--;render();persist();if(seconds<=0)stop()},1000)};w.querySelector('[data-reset]').onclick=()=>{stop();seconds=1200;render();persist()};render();persist();return w}
function renderBgCards(){const make=(container,items,type)=>{const c=document.getElementById(container);c.innerHTML='';items.forEach((item,i)=>{const card=document.createElement('button');card.className='bgCard';card.type='button';const url=Array.isArray(item)?item[1]:item;card.style.backgroundImage=type==='gradient'?url:`url("${url.includes('images.unsplash.com')?url.replace(/([?&])w=2200/, '$1w=420').replace(/([?&])q=\d+/, '$1q=65'):url}")`;const label=document.createElement('span');label.className='bgLabel';label.textContent=Array.isArray(item)?item[0]:['Vår','Sommar','Höst','Vinter'][i]||'';card.appendChild(label);card.onclick=()=>setBackground(type==='gradient'?url:url);c.appendChild(card)})};make('natureGrid',natureBackgrounds,'image');extraNatureBackgrounds.forEach((items,i)=>make('extraBg'+i,items,'image'));make('calmGrid',calmBackgrounds,'gradient');make('seasonGrid',seasonBackgrounds,'image');loadCustomBackgrounds()}
function setBackground(value){if(value.startsWith('linear-gradient')){document.body.style.backgroundImage=value;state.backgrounds={type:'gradient',value}}else{document.body.style.backgroundImage=`url("${value}")`;state.backgrounds={type:'image',value}}saveState();closeBackgrounds()}
function openBackgrounds(){renderBgCards();document.getElementById('backgroundPanel').classList.add('open')}
function closeBackgrounds(){document.getElementById('backgroundPanel').classList.remove('open')}
function loadCustomBackgrounds(){const c=document.getElementById('customGrid');const add=c.querySelector('.bgAdd');c.innerHTML='';c.appendChild(add);(state.customBackgrounds||[]).forEach((item,idx)=>{const card=document.createElement('button');card.type='button';card.className='bgCard';card.style.backgroundImage=`url("${item.data}")`;const label=document.createElement('span');label.className='bgLabel';label.textContent=item.name||'Egen';card.appendChild(label);card.onclick=()=>setBackground(item.data);c.appendChild(card)})}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function handleBackgroundUpload(file){if(!file)return;const data=await readFileAsDataURL(file);state.customBackgrounds=state.customBackgrounds||[];state.customBackgrounds.unshift({name:file.name,data});state.customBackgrounds=state.customBackgrounds.slice(0,6);saveState();setBackground(data);renderBgCards()}
document.getElementById('backgroundUpload').addEventListener('change',e=>{handleBackgroundUpload(e.target.files[0]);e.target.value=''})
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function applySavedBackground(){const b=state.backgrounds;if(!b)return;if(b.type==='gradient')document.body.style.backgroundImage=b.value;else if(b.type==='image')document.body.style.backgroundImage=`url("${b.value}")`}
function restoreWindows(){
  const old=state.windows||{};
  state.windows={};
  Object.entries(old).forEach(([id,s])=>{
    if(!s||s.type==='nu')return;
    let w=null;
    const opts={id,left:s.left,width:s.width,height:s.height};
    if(s.type==='lesson'||s.type==='day')w=createLesson(s.data,true,opts);
    else if(s.type==='note')w=createNote(s.data,opts);
    else if(s.type==='schedule')w=createSchedule(s.data,opts);
    else if(s.type==='links')w=createLinks(s.data,opts);
    else if(s.type==='clock')w=createClock(opts);
    else if(s.type==='timer')w=createTimer(s.data,opts);
    if(w&&s.minimized)w.classList.add('minimized');
  });
  saveState();
}
function cleanupOldState(){let changed=false;Object.entries(state.windows||{}).forEach(([id,s])=>{if(s.type==='nu'){delete state.windows[id];changed=true}});if(changed)saveState()}
function initialize(){cleanupOldState();applySavedBackground();const existing=Object.values(state.windows||{}).filter(s=>s&&s.type!=='nu');if(existing.length)restoreWindows();else{createLesson();createSchedule();createClock()}renderBgCards()}
initialize();
</script>
