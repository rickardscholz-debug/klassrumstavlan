<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klassrumstavlan</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;overflow:hidden;color:#202735}
body{background:#547890 center/cover no-repeat}
#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;display:none}
#board{position:fixed;inset:0 0 112px}
.widget{position:absolute;min-width:220px;min-height:150px;background:#fff;border-radius:15px;box-shadow:0 12px 35px #0004;resize:both;overflow:hidden;border:1px solid #ffffffaa}
.head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#ffffffd9;cursor:move;font-weight:700;font-size:14px}
.head .close{border:0;background:transparent;font-size:20px;cursor:pointer}.body{height:calc(100% - 38px);padding:13px;overflow:auto}
.note{background:#fff6c8}.note .head{background:#fff0a6}.note .body{padding:0}
.note textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;padding:20px;font:400 21px/1.5 Arial,sans-serif;color:#4c4c43}
.clockWidget .body{display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:700}
.dayWidget .today{font-size:29px;font-weight:800;text-transform:capitalize}.dayWidget .date{font-size:22px;margin-top:7px}
.linksGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.linksGrid .serviceLink{display:flex;align-items:center;justify-content:center;padding:16px 10px;border:0;border-radius:13px;background:#f0f3f7;font-size:16px;font-weight:700;cursor:pointer;color:#202735;text-decoration:none;text-align:center}.linksGrid .serviceLink:hover{background:#e1e8f0}
.imageWidget .body,.videoWidget .body,.pdfWidget .body{padding:0;background:#111}.imageWidget img,.videoWidget video,.pdfWidget iframe{width:100%;height:100%;object-fit:contain;border:0}
.timerNum{font-size:48px;text-align:center;font-weight:800}.row{display:flex;gap:7px}.row input{width:90px;padding:8px}.row button{flex:1}
.toolbar{position:fixed;z-index:1000;left:50%;bottom:18px;transform:translateX(-50%);height:78px;max-width:96vw;background:#fff;border-radius:19px;box-shadow:0 10px 35px #0004;display:flex;align-items:center;gap:3px;padding:7px 10px;overflow-x:auto}
.tool{min-width:76px;height:64px;border:0;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#202735;font-size:12px;white-space:nowrap}.tool:hover{background:#edf2f8}.ico{font-size:27px;line-height:27px}
.filetool input{display:none}.moreMenu{position:fixed;z-index:1100;bottom:105px;left:50%;transform:translateX(-50%);display:none;background:#fff;border-radius:15px;box-shadow:0 10px 35px #0004;padding:10px;gap:6px}.moreMenu.open{display:flex}
button.action{border:0;border-radius:9px;padding:9px 11px;background:#334155;color:#fff;cursor:pointer}
input,textarea{font:inherit}
@media(max-width:700px){.toolbar{left:7px;right:7px;transform:none}.tool{min-width:68px}}

.scheduleWidget .body{background:#fff;padding:12px}
.scheduleTop{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.scheduleTop button,.scheduleTop label{border:0;border-radius:9px;background:#eef2f7;padding:9px 10px;font-weight:700;cursor:pointer}
.scheduleTop input[type=file]{display:none}
.scheduleHint{font-size:12px;color:#64748b;margin:5px 0 10px}
.scheduleRows{display:flex;flex-direction:column;gap:7px}
.scheduleRow{display:grid;grid-template-columns:56px 1fr 92px 34px;gap:6px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:6px}
.scheduleIcon{font-size:28px;text-align:center}
.scheduleRow input{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:7px}
.scheduleRow .del{border:0;background:transparent;font-size:18px;cursor:pointer}
.schedulePreview{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:9px}
.scheduleCard{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:8px;border-bottom:2px solid #334155;padding:7px 3px}
.scheduleCard .pic{font-size:29px;text-align:center}.scheduleCard .subject{font-weight:800}.scheduleCard .time{font-weight:700;color:#475569}
.ocrStatus{font-size:12px;color:#475569;margin-top:6px}
</style></head>
<body>
<video id="bgVideo" muted loop playsinline></video>
<div id="board"></div>

<div class="toolbar">
<button class="tool" id="btnNote" data-add="note"><span class="ico">📝</span><span>Anteckning</span></button>
<button class="tool" id="btnDay" data-add="day"><span class="ico">📅</span><span>Dagen</span></button>
<button class="tool" id="btnLinks" data-add="links"><span class="ico">🔗</span><span>Länkar</span></button>
<button class="tool" id="btnClock" data-add="clock"><span class="ico">🕒</span><span>Klocka</span></button>
<button class="tool" id="btnTimer" data-add="timer"><span class="ico">⌛</span><span>Timer</span></button>
<label class="tool filetool"><span class="ico">🖼️</span><span>Bild</span><input id="imageFile" type="file" accept="image/*"></label>
<label class="tool filetool"><span class="ico">🏞️</span><span>Bakgrund</span><input id="bgFile" type="file" accept="image/*,video/mp4,video/webm,video/ogg"></label>
<button class="tool" id="btnSchedule"><span class="ico">📋</span><span>Schema</span></button>
</div>
<script>
const board=document.querySelector('#board'), KEY='klassrumstavlan-v5', bgVideo=document.querySelector('#bgVideo');
let state={widgets:[]}, bgURL=null;
try { state=JSON.parse(localStorage.getItem(KEY)||'{"widgets":[]}'); }
catch(e) { state={widgets:[]}; localStorage.removeItem(KEY); }
const linkList=[
 ['🧩','Skolon','https://skolon.com/'],
 ['▶️','UR Play','https://urplay.se/'],
 ['📺','SVT Play','https://www.svtplay.se/'],
 ['🎬','SLI','https://sliplay.se/'],
 ['🔴','YouTube','https://www.youtube.com/']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function collect(w){let d={};w.querySelectorAll('[data-k]').forEach(e=>d[e.dataset.k]=e.value);return d}
function save(){state.widgets=[...document.querySelectorAll('.widget')].map(w=>({id:w.id,type:w.dataset.type,x:w.offsetLeft,y:w.offsetTop,width:w.offsetWidth,height:w.offsetHeight,data:collect(w)}));localStorage.setItem(KEY,JSON.stringify(state))}
function add(type,s={}){
 let w=document.createElement('section');w.className='widget '+type+'Widget '+(type==='note'?'note':'');w.dataset.type=type;w.id=s.id||'w'+Date.now()+Math.random();
 let size={note:[325,390],day:[350,190],links:[390,300],clock:[300,170],timer:[320,200],image:[480,350],video:[480,350],pdf:[480,400],schedule:[390,560]}[type]||[330,220];
 w.style.left=(s.x??60+Math.random()*250)+'px';w.style.top=(s.y??50+Math.random()*140)+'px';w.style.width=(s.width||size[0])+'px';w.style.height=(s.height||size[1])+'px';
 let d=s.data||{}, title={note:'Anteckning',day:'Dagen',links:'Länkar',clock:'Klocka',timer:'Timer',image:'Bild',video:'Video',pdf:'PDF'}[type], c='';
 if(type==='note')c=`<textarea data-k="text" placeholder="Gör en anteckning...">${esc(d.text)}</textarea>`;
 if(type==='day')c='<div class="today"></div><div class="date"></div>';
 if(type==='links')c='<div class="linksGrid">'+linkList.map(x=>`<a class="serviceLink" href="${x[2]}" target="_blank" rel="noopener noreferrer">${x[0]} ${x[1]}</a>`).join('')+'</div>';
 if(type==='clock')c='<div class="clockText">--:--</div>';
 if(type==='timer')c=`<div class="timerNum">05:00</div><div class="row"><input data-k="minutes" type="number" min="1" value="${esc(d.minutes||5)}"><button class="action start">Start</button><button class="action stop">Stopp</button></div>`;
 if(type==='image')c='<img alt="Infogad bild">';
 if(type==='video')c='<video controls playsinline></video>';
 if(type==='pdf')c='<iframe title="PDF"></iframe>';
 if(type==='schedule')c=`<div class="scheduleTop">
   <button class="addScheduleRow">＋ Rad</button>
   <label>📷 Läs schema från bild<input class="scheduleImage" type="file" accept="image/*"></label>
   <button class="makePreview">Visa</button>
 </div>
 <div class="scheduleHint">Snabbast: lägg till rader själv – eller välj en bild av elevernas schema. Bilden läses lokalt i webbläsaren och föreslår tider/ämnen som du sedan kan rätta.</div>
 <div class="scheduleRows"></div>
 <div class="ocrStatus"></div>
 <div class="schedulePreview"></div>`;

 w.innerHTML=`<div class="head"><span>${title}</span><button class="close">×</button></div><div class="body">${c}</div>`;board.appendChild(w);wire(w);drag(w);save();return w
}
function wire(w){
 w.querySelector('.close').onclick=()=>{if(w._url)URL.revokeObjectURL(w._url);w.remove();save()};
 w.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('input',save));
 if(w.dataset.type==='day'){let a=w.querySelector('.today'),b=w.querySelector('.date'),f=()=>{let n=new Date();a.textContent=n.toLocaleDateString('sv-SE',{weekday:'long'});b.textContent=n.toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'})};f();setInterval(f,60000)}
 if(w.dataset.type==='clock'){let e=w.querySelector('.clockText'),f=()=>e.textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});f();setInterval(f,1000)}
 
 if(w.dataset.type==='timer'){let t=null,left=0,out=w.querySelector('.timerNum');let draw=()=>out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');w.querySelector('.start').onclick=()=>{clearInterval(t);left=Math.max(1,+w.querySelector('[data-k=minutes]').value||5)*60;draw();t=setInterval(()=>{left--;draw();if(left<=0){clearInterval(t);alert('Tiden är slut!')}},1000)};w.querySelector('.stop').onclick=()=>clearInterval(t)}

 if(w.dataset.type==='schedule'){
   const rows=w.querySelector('.scheduleRows'), status=w.querySelector('.ocrStatus');
   const icons={svenska:'🇸🇪',sva:'🇸🇪',matte:'➗',matematik:'➗',so:'🌍',geografi:'🌍',historia:'🏰',religion:'🕊️',no:'🔬',naturkunskap:'🔬',engelska:'🇬🇧',musik:'🎵',bild:'🎨',idrott:'⚽',rast:'🛝',lunch:'🍽️',slöjd:'🧵'};
   function iconFor(t){let q=t.toLowerCase();for(const k in icons)if(q.includes(k))return icons[k];return '📘'}
   function row(subject='',time='',icon=''){
     const r=document.createElement('div');r.className='scheduleRow';
     r.innerHTML=`<div class="scheduleIcon">${icon||iconFor(subject)}</div><input class="schSubject" placeholder="Ämne/aktivitet" value="${subject.replace(/"/g,'&quot;')}"><input class="schTime" placeholder="08:10–09:00" value="${time.replace(/"/g,'&quot;')}"><button class="del">×</button>`;
     r.querySelector('.del').onclick=()=>r.remove();
     r.querySelector('.schSubject').oninput=()=>r.querySelector('.scheduleIcon').textContent=iconFor(r.querySelector('.schSubject').value);
     rows.appendChild(r);
   }
   function preview(){
     const list=[...rows.querySelectorAll('.scheduleRow')];
     w.querySelector('.schedulePreview').innerHTML=list.map(r=>`<div class="scheduleCard"><div class="pic">${r.querySelector('.scheduleIcon').textContent}</div><div class="subject">${r.querySelector('.schSubject').value||'Aktivitet'}</div><div class="time">${r.querySelector('.schTime').value}</div></div>`).join('');
   }
   w.querySelector('.addScheduleRow').onclick=()=>row();
   w.querySelector('.makePreview').onclick=preview;
   if(!rows.children.length){row('SO','08:10–09:00');row('Rast','09:00–09:20');row('Matematik','09:20–10:10');row('Lunch','11:20–12:00');}
   w.querySelector('.scheduleImage').onchange=async e=>{
     const file=e.target.files[0];if(!file)return;
     status.textContent='Läser bilden… första gången kan detta ta en stund.';
     try{
       if(!window.Tesseract){
         await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
       }
       const result=await Tesseract.recognize(file,'swe+eng');
       const text=result.data.text||'';
       const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
       const timeRx=/(\d{1,2}[:.]\d{2})\s*[-–—]?\s*(\d{1,2}[:.]\d{2})?/;
       const known=['Svenska','SvA','Matematik','Matte','SO','Geografi','Historia','Religion','NO','Engelska','Musik','Bild','Idrott','Rast','Lunch','Slöjd'];
       rows.innerHTML='';
       for(const line of lines){
         const low=line.toLowerCase();let subject=known.find(k=>low.includes(k.toLowerCase()));
         if(!subject)continue;
         const m=line.match(timeRx);let time=m?(m[1].replace('.',':')+(m[2]?'–'+m[2].replace('.',':'):'')):'';
         row(subject,time);
       }
       if(!rows.children.length){row();status.textContent='Jag kunde inte säkert hitta ämnen i bilden. Lägg in/rätta raderna manuellt.'}
       else status.textContent='Förslag klart. Kontrollera tider och ämnen och tryck Visa.';
       preview();
     }catch(err){status.textContent='Bildläsningen kunde inte starta. Du kan fortfarande skapa schemat snabbt med ＋ Rad.'}
     e.target.value='';
   };
 }
}
function drag(w){let h=w.querySelector('.head'),on=false,sx,sy,ox,oy;h.onpointerdown=e=>{if(e.target.closest('button'))return;on=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(on){w.style.left=Math.max(0,ox+e.clientX-sx)+'px';w.style.top=Math.max(0,oy+e.clientY-sy)+'px'}};h.onpointerup=()=>{on=false;save()};new ResizeObserver(save).observe(w)}
document.getElementById('btnNote').addEventListener('click',()=>add('note'));
document.getElementById('btnDay').addEventListener('click',()=>add('day'));
document.getElementById('btnLinks').addEventListener('click',()=>add('links'));
document.getElementById('btnClock').addEventListener('click',()=>add('clock'));
document.getElementById('btnTimer').addEventListener('click',()=>add('timer'));
function fileWidget(id,type,sel){
 const input=document.querySelector(id);
 input.onchange=e=>{
   const f=e.target.files[0];
   if(!f) return;
   const w=add(type);
   const u=URL.createObjectURL(f);
   w._url=u;
   w.querySelector(sel).src=u;
   if(type==='video') w.querySelector(sel).load();
   e.target.value='';
 };
}
fileWidget('#imageFile','image','img');fileWidget('#videoFile','video','video');fileWidget('#pdfFile','pdf','iframe');
document.querySelector('#bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(bgURL)URL.revokeObjectURL(bgURL);bgURL=URL.createObjectURL(f);document.body.style.backgroundImage='none';bgVideo.pause();bgVideo.style.display='none';bgVideo.removeAttribute('src');if(f.type.startsWith('image/'))document.body.style.backgroundImage=`url("${bgURL}")`;else if(f.type.startsWith('video/')){bgVideo.src=bgURL;bgVideo.style.display='block';bgVideo.load();bgVideo.play().catch(()=>{})}e.target.value=''};
document.querySelector('#btnSchedule').onclick=()=>add('schedule');
if(state.widgets?.length)state.widgets.forEach(x=>add(x.type,x));
</script></body></html>
